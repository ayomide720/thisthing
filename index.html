<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mining Game with AutoMine</title>
<style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    button { padding: 10px; margin: 5px; }
    #output { white-space: pre; margin-top: 20px; max-height: 400px; overflow-y: auto; border: 1px solid #555; padding: 10px; }
    .gold { color: gold; font-weight: bold; }
    .silver { color: silver; font-weight: bold; }
    .ionized { color: deepskyblue; font-weight: bold; }
    .quantum { color: violet; font-weight: bold; }
    .layer { color: #555; }
    #money { font-size: 1.2em; margin-bottom: 10px; }
</style>
</head>
<body>
<h1>Mining Game</h1>
<div id="money" aria-live="polite">Money: $0</div>
<button id="mineBtn" aria-label="Mine once">Mine 1x</button>
<button id="mine10Btn" aria-label="Mine ten times">Mine 10x</button>
<button id="autoBtn" aria-label="Toggle AutoMine">Start AutoMine</button>
<button id="clearBtn" aria-label="Clear log">Clear Log</button>
<div id="output" aria-label="Mining log"></div>

<script src="https://unpkg.com/fengari-web/dist/fengari-web.js"></script>
<script>
const { lua, lauxlib, lualib, to_luastring, to_jsstring } = fengari;

const output = document.getElementById("output");
const moneyDiv = document.getElementById("money");

// Create Lua state
const L = lauxlib.luaL_newstate();
lualib.luaL_openlibs(L);

// Lua code
const luaCode = `
math.randomseed(os.time())
ores = {
    ore1={name="Cobalt", chance=50, money=15, tier="Common"},
    ore2={name="Quartz", chance=100, money=25, tier="Common"},
    ore3={name="Jadeite", chance=300, money=50, tier="Rare"},
    ore4={name="Obsidian", chance=600, money=100, tier="Rare"},
    ore5={name="Aetherite", chance=3000, money=500, tier="Master"},
    ore6={name="Vibranium", chance=10000, money=1000, tier="Surreal"},
    ore7={name="Mythril", chance=50000, money=5000, tier="Mythic"},
    ore8={name="Titanium", chance=75000, money=7500, tier="Mythic"},
    ore9={name="Chronium", chance=100000, money=10000, tier="Mythic"},
    ore10={name="Eternium", chance=150000, money=15000, tier="Mythic"}
}

variants = {
    gold={chance=10, multiplier=2},
    silver={chance=20, multiplier=1.5},
    ionized={chance=30, multiplier=2.5},
    quantum={chance=40, multiplier=3}
}

money=0

function rollVariants()
    local rolled={}, mult=1
    for k,v in pairs(variants) do
        if math.random(1,v.chance)==1 then
            table.insert(rolled,k)
            mult=mult*v.multiplier
        end
    end
    return rolled, mult
end

function rollOnce()
    local priority={"ore10","ore9","ore8","ore7","ore6","ore5","ore4","ore3","ore2","ore1"}
    for _,key in ipairs(priority) do
        local ore = ores[key]
        if math.random(1, ore.chance)==1 then
            local rolledVariants, mult = rollVariants()
            local displayName = ore.name
            if #rolledVariants>0 then
                displayName = displayName.." ("..table.concat(rolledVariants,"+")..")"
            end
            local earned = ore.money * mult
            money = money + earned
            return displayName, ore.tier, earned, money
        end
    end
    money = money + 5
    return "StoneBlock", "Layer", 5, money
end
`;

lauxlib.luaL_dostring(L, to_luastring(luaCode));

// Function to mine once
function mineOnce() {
    lua.lua_getglobal(L, to_luastring("rollOnce"));
    lua.lua_call(L,0,4);
    const oreName = to_jsstring(lua.lua_tostring(L,-4));
    const tier = to_jsstring(lua.lua_tostring(L,-3));
    const earned = lua.lua_tonumber(L,-2);
    const totalMoney = lua.lua_tonumber(L,-1);
    lua.lua_pop(L,4);
    return {oreName, tier, earned, totalMoney};
}

// Render a single mine result
function renderResult(res) {
    let classes = [];
    if(res.oreName.toLowerCase().includes("gold")) classes.push("gold");
    if(res.oreName.toLowerCase().includes("silver")) classes.push("silver");
    if(res.oreName.toLowerCase().includes("ionized")) classes.push("ionized");
    if(res.oreName.toLowerCase().includes("quantum")) classes.push("quantum");
    if(res.oreName==="StoneBlock") classes.push("layer");
    const span = document.createElement("span");
    span.textContent = `${res.oreName} [${res.tier}] +$${Math.floor(res.earned)}\n`;
    span.className = classes.join(" ");
    output.appendChild(span);
    // Limit output log to last 200 entries
    while(output.childNodes.length > 200) {
        output.removeChild(output.firstChild);
    }
    output.scrollTop = output.scrollHeight;
    moneyDiv.textContent = `Money: $${Math.floor(res.totalMoney)}`;
}

// Button events
document.getElementById("mineBtn").onclick = () => renderResult(mineOnce());
document.getElementById("mine10Btn").onclick = () => {
    for(let i=0; i<10; i++) renderResult(mineOnce());
};
document.getElementById("clearBtn").onclick = () => {
    output.innerHTML = "";
};

// AutoMine
let autoMining = false;
let autoInterval = null;

document.getElementById("autoBtn").onclick = () => {
    autoMining = !autoMining;
    if(autoMining){
        document.getElementById("autoBtn").textContent = "Stop AutoMine";
        autoInterval = setInterval(() => renderResult(mineOnce()), 200);
    } else {
        document.getElementById("autoBtn").textContent = "Start AutoMine";
        clearInterval(autoInterval);
        autoInterval = null;
    }
};
</script>
</body>
</html>
