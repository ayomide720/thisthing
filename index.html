<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mining Game</title>
<style>
    :root {
        --bg-color: #0d0f12;
        --card-bg: #161920;
        --card-border: #232733;
        --text-main: #f0f3f8;
        --text-muted: #8a94a6;
        --accent-gold: #fbbf24;
        --accent-blue: #38bdf8;
        --accent-green: #4ade80;
        --accent-purple: #c084fc;
        --accent-red: #f87171;
        --btn-bg: #222734;
        --btn-hover: #2d3446;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .main-wrapper {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 960px;
        align-items: flex-start;
    }

    .container {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        flex: 1;
        min-width: 0;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        position: relative;
    }

    .inventory-sidebar {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        width: 360px;
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        max-height: 85vh;
    }

    .inventory-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--card-border);
    }

    .inventory-header h2 {
        font-size: 1.125rem;
    }

    .inventory-scroll {
        overflow-y: auto;
        flex: 1;
        padding-right: 4px;
    }

    .nav-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }

    .nav-btn {
        flex: 1;
        padding: 10px;
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .nav-btn:hover {
        background: var(--btn-hover);
        border-color: #3b4254;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 12px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
    }

    .stat-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--card-border);
        padding: 12px;
        border-radius: 10px;
        text-align: center;
    }

    .stat-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 1.25rem;
        font-weight: 700;
    }

    #money { color: var(--accent-gold); }
    #blocksMined { color: var(--accent-blue); }

    .controls-panel {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.875rem;
    }

    input[type="number"], select {
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        padding: 8px 12px;
        border-radius: 6px;
        outline: none;
        font-size: 0.875rem;
    }

    input[type="number"] {
        width: 70px;
        text-align: center;
    }

    select {
        width: 100%;
        cursor: pointer;
    }

    .badge {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: rgba(255, 255, 255, 0.05);
        padding: 4px 8px;
        border-radius: 4px;
    }

    #oreInfoBox {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 0.875rem;
        line-height: 1.5;
    }

    #leaderboardBox {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 20px;
    }

    #leaderboardBox b {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 8px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    #leaderboardList {
        padding-left: 20px;
        font-size: 0.875rem;
    }

    #leaderboardList li {
        margin-bottom: 4px;
    }

    .action-row {
        display: grid;
        grid-template-columns: 2fr 2fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
    }

    .action-btn {
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    #mineBtn {
        background: var(--accent-blue);
        color: #000;
    }

    #mineBtn:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
    }

    #autoBtn {
        background: var(--accent-gold);
        color: #000;
    }

    #autoBtn:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
    }

    #clearBtn {
        background: var(--btn-bg);
        color: var(--text-muted);
        border: 1px solid var(--card-border);
    }

    #clearBtn:hover {
        background: var(--btn-hover);
        color: var(--text-main);
    }

    #output {
        background: #090a0f;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px;
        height: 180px;
        overflow-y: auto;
        font-family: 'Fira Code', monospace;
        font-size: 0.8125rem;
        line-height: 1.6;
        color: var(--text-muted);
    }

    .panel {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--card-bg);
        border-radius: 16px;
        z-index: 100;
        padding: 24px;
        box-sizing: border-box;
        overflow-y: auto;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--card-border);
    }

    .panel-header h2 {
        font-size: 1.25rem;
    }

    .close-btn {
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
        margin-top: 10px;
    }

    th, td {
        padding: 10px 8px;
        text-align: left;
        border-bottom: 1px solid var(--card-border);
    }

    th {
        color: var(--text-muted);
        font-weight: 600;
    }

    .inv-item {
        border-bottom: 1px solid var(--card-border);
        padding: 8px 0;
    }

    .inv-item-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
    }

    .inv-item-name {
        font-weight: 600;
        font-size: 0.875rem;
    }

    .inv-item-count {
        font-weight: 700;
        font-size: 0.875rem;
    }

    .inv-variants-panel {
        display: none;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 6px;
        padding: 8px;
        margin-top: 6px;
        font-size: 0.75rem;
        color: var(--text-muted);
    }

    .variant-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
    }

    .progress-bar-bg {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        height: 10px;
        width: 100%;
        margin: 8px 0 16px 0;
        overflow: hidden;
    }

    .progress-bar-fill {
        background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
    }

    #notification {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--btn-hover);
        color: var(--text-main);
        border: 1px solid var(--accent-blue);
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 0.875rem;
        font-weight: 600;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 999;
    }

    @media (max-width: 820px) {
        .main-wrapper {
            flex-direction: column;
            align-items: stretch;
        }
        .inventory-sidebar {
            width: 100%;
            max-height: 300px;
        }
    }

    /* Variant Colors */
    .gold { color: var(--accent-gold); font-weight: bold; }
    .silver { color: #cbd5e1; font-weight: bold; }
    .ionized { color: var(--accent-blue); font-weight: bold; }
    .quantum { color: var(--accent-purple); font-weight: bold; }

    /* Tier Scaling CSS (1 to 100 Billion) */
    .rarity-layer { color: var(--text-muted); }
    .rarity-lava { color: var(--accent-red); }
    .rarity-common { color: var(--accent-green); }
    .rarity-uncommon { color: #2dd4bf; }
    .rarity-rare { color: var(--accent-blue); }
    .rarity-epic { color: #3b82f6; }
    .rarity-legendary { color: #eab308; }
    .rarity-master { color: var(--accent-purple); }
    .rarity-surreal { color: #f472b6; }
    .rarity-mythic { color: var(--accent-gold); }
    .rarity-exotic { color: #fb923c; }
    .rarity-exquisite { color: #e879f9; }
    .rarity-transcendent { color: #a855f7; }
    .rarity-enigmatic { color: #f43f5e; }
    .rarity-unfathomable { color: #6366f1; }
    .rarity-otherworldly { color: #38bdf8; }
    .rarity-cosmic { color: #818cf8; }
    .rarity-celestial { color: #67e8f9; }
    .rarity-ethereal { color: #f472b6; }
    .rarity-primordial { color: #fb7185; }
    .rarity-chronos { color: #a78bfa; }
    .rarity-infinite { color: #34d399; }
    .rarity-singularity { color: #f43f5e; }
    .rarity-omnipotent { color: #ffffff; text-shadow: 0 0 8px #fff, 0 0 12px #fbbf24; font-weight: bold; }
</style>
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        <div class="nav-bar">
            <button class="nav-btn" id="blacksmithToggle">Blacksmith</button>
            <button class="nav-btn" id="gearsToggle">Gears</button>
        </div>

        <!-- Blacksmith Panel -->
        <div id="blacksmithPanel" class="panel">
            <div class="panel-header">
                <h2>Blacksmith</h2>

            </div>
            <div>

                    <div class="progress-bar-fill" id="stonePickaxeProgressBar"></div>
                </div>
                <table>
                    <thead>

                            <th>Owned</th>

                    </thead>

                        <tr>
                            <td>Stone</td>

                        <tr>
                            <td>Copper</td>
                            <td id="copperOwned"></td>

                        </tr>
                        <tr>
                            <td>Money</td>
                            <td id="moneyOwned"></td>
                            <td>500</td>
                            <td id="moneyPercent"></td>
                        </tr>
                    </tbody>
                </table>
                <button class="nav-btn" id="buyStonePickaxeBlacksmith" style="margin-top:16px; width:100%;">Craft Stone Pickaxe</button>
                <div id="blacksmithPickaxeInfo" style="font-size:0.8125rem; color: var(--accent-green); margin-top:8px;"></div>
            </div>
        </div>

        <!-- Gears Panel -->
        <div id="gearsPanel" class="panel">
            <div class="panel-header">
                <h2>Gears</h2>
                <button class="close-btn" id="closeGears">Close</button>
            </div>
            <div>
                <b>Speed Coil</b>
                <div id="speedCoilStatus" style="font-size:0.875rem; color: var(--text-muted); margin: 4px 0;"></div>
                <div style="font-size:0.875rem; margin-bottom: 8px;">Cost: $1,000</div>
                <button class="nav-btn" id="craftSpeedCoil" style="width:100%;">Craft Speed Coil</button>
                <div id="speedCoilInfo" style="font-size:0.8125rem; color: var(--accent-green); margin-top:8px;">Reduces mining interval by 10ms.</div>
            </div>
        </div>

        <div class="header">
            <h1>⛏️ Mining Simulator</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Balance</div>
                    <div class="stat-value" id="money">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Blocks Mined</div>
                    <div class="stat-value" id="blocksMined">0</div>
                </div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="control-row">
                <label for="luckInput" style="font-weight:600;">Luck Multiplier</label>
                <div>
                    <input id="luckInput" type="number" min="1" step="0.01" value="1">
                    <span class="badge" id="luckDisplay">1x</span>
                </div>
            </div>
            <div class="control-row">
                <span style="font-weight:600;">Mining Speed</span>
                <span class="badge" id="speedDisplay">50ms</span>
            </div>
        </div>

        <div id="pickaxeInfo" style="font-size:0.8125rem; color: var(--accent-green); margin-bottom: 12px; text-align: center;"></div>

        <select id="layerSelect" style="margin-bottom:12px;">
            <option value="1">Layer 1 (Normal)</option>
            <option value="2">Layer 2 (Lava Layer)</option>
            <option value="3">Basalt Layer</option>
        </select>

        <div class="control-row" style="margin-bottom: 6px;">
            <label for="oreInfoSelect" style="font-size:0.75rem; color: var(--text-muted); text-transform:uppercase;">Ore Index</label>
        </div>
        <select id="oreInfoSelect" style="margin-bottom:12px;"></select>
        
        <div id="oreInfoBox"></div>

        <div id="leaderboardBox">
            <b>Rarest Ore Leaderboard</b>
            <ol id="leaderboardList"></ol>
        </div>

        <div class="action-row">
            <button class="action-btn" id="mineBtn">Mine 1x</button>
            <button class="action-btn" id="autoBtn">Auto Mine</button>
            <button class="action-btn" id="clearBtn">Clear</button>
        </div>

        <div id="output"></div>

        <div id="notification">Notification message</div>
    </div>

    <div class="inventory-sidebar">
        <div class="inventory-header">
            <h2>📦 Inventory</h2>
            <button class="close-btn" id="expandAllVariantsBtn" style="font-size:0.75rem;">Toggle Variants</button>
        </div>
        <div class="inventory-scroll" id="inventoryList"></div>
    </div>
</div>

    { threshold: 75000000000, tier: "Singularity", cssClass: "singularity" },
    { threshold: 100000000000, tier: "Omnipotent", cssClass: "omnipotent" }
];

function assignDynamicTier(ore) {
    if (ore.chance === 0) {
        if (!ore.tier) ore.tier = "Layer";
        ore.cssClass = ore.tier.toLowerCase();
        return;
    }
    let assigned = tierThresholds[0];
    for (let i = 0; i < tierThresholds.length; i++) {
        if (ore.chance >= tierThresholds[i].threshold) {
            assigned = tierThresholds[i];
        } else {
            break;
        }
    }
    ore.tier = assigned.tier;
    ore.cssClass = assigned.cssClass;

    {name:"Pyroxis", chance:800000000, money:500000}
];

const basaltOres = [
    {name:"Basalt", chance:0, money:5},
    {name:"Coal", chance:25, money:10},
    {name:"Quartz", chance:50, money:15},
    {name:"Iron", chance:55, money:20},
    {name:"Hemimorphite", chance:300, money:35},
    {name:"Druzurite", chance:455, money:40},
    {name:"Turquenite", chance:3175, money:60},
    {name:"Cobalt", chance:5450, money:75},
    {name:"Yvonite", chance:8185, money:100},
    {name:"Chalcedony", chance:17200, money:150},
    {name:"Bluesteel", chance:22500, money:200},
    {name:"Afghanite", chance:28100, money:250},
    {name:"Cryoclase", chance:48488, money:350},
    {name:"Coldfirium", chance:65200, money:500},
    {name:"Lavendulan", chance:72200, money:650},
    {name:"Tanzanite", chance:95500, money:900},
    {name:"Elysian", chance:155000, money:1200},
    {name:"Nocturnite", chance:670000, money:2000},
    {name:"Nuummite", chance:875000, money:3000},
    {name:"Freon", chance:3333333, money:5000},
    {name:"Snoblintium", chance:4220000, money:8000},
    {name:"Nauticalis", chance:12221221, money:12000},
    {name:"Azuryl", chance:26700000, money:20000},
    {name:"Glacielle", chance:31400000, money:35000},
    {name:"Cybernetium", chance:52400000, money:50000},
    {name:"Bulbalescense", chance:81818181, money:75000},
    {name:"Inclemetite", chance:386500000, money:100000}
];

const lavaLayerBlock = {name:"Lava", chance:0, money:5, tier:"Lava"};

[...ores, ...lavaOres, ...basaltOres].forEach(assignDynamicTier);
assignDynamicTier(lavaLayerBlock);

const variants = [
    {name:"gold", chance:10, multiplier:2},
    {name:"silver", chance:20, multiplier:1.5},
    {name:"ionized", chance:30, multiplier:2.5},
    {name:"quantum", chance:40, multiplier:3}
];

// Pickaxe Engine with Base Luck Modifiers
const pickaxeData = {
    none: { name: "Default", baseLuck: 1.0 },
    stone: { name: "Stone Pickaxe", baseLuck: 1.05 } // Stone Ravager base luck
};

let gears = { speedCoil: false };
let variantToggles = {};

function saveData() {
    localStorage.setItem("mining_leaderboard", JSON.stringify(leaderboard));
    localStorage.setItem("mining_inventory", JSON.stringify(inventory));
    localStorage.setItem("mining_money", money);
    localStorage.setItem("mining_pickaxe", pickaxe);
    localStorage.setItem("mining_blocksMined", blocksMined);
    localStorage.setItem("mining_gears", JSON.stringify(gears));
}

function loadData() {
    const lb = localStorage.getItem("mining_leaderboard");
    const inv = localStorage.getItem("mining_inventory");
    leaderboard = lb ? JSON.parse(lb) : [];
    inventory = inv ? JSON.parse(inv) : {};
    money = Number(localStorage.getItem("mining_money")) || 0;
    pickaxe = localStorage.getItem("mining_pickaxe") || "none";
    blocksMined = Number(localStorage.getItem("mining_blocksMined")) || 0;
    const g = localStorage.getItem("mining_gears");
    gears = g ? JSON.parse(g) : { speedCoil: false };
}

let leaderboard = [];
let inventory = {};
let blocksMined = 0;
let money = 0;
let pickaxe = "none";
loadData();

const output = document.getElementById("output");
const moneyDiv = document.getElementById("money");
const blocksMinedDiv = document.getElementById("blocksMined");
const oreInfoSelect = document.getElementById("oreInfoSelect");
const oreInfoBox = document.getElementById("oreInfoBox");

function getTotalLuck() {
    let pLuck = pickaxeData[pickaxe] ? pickaxeData[pickaxe].baseLuck : 1.0;
    let gearMultiplier = 1.0;
    return luck * pLuck * gearMultiplier;
}

function fillOreDropdown(layer) {
    oreInfoSelect.innerHTML = "";
    let list = layer == 2 ? [lavaLayerBlock, ...lavaOres] : (layer == 3 ? basaltOres : ores);
    list.forEach((ore, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = ore.name;
        oreInfoSelect.appendChild(opt);
    });
    showOreInfo(list[0]);
}

function showOreInfo(ore) {
    let chanceText = ore.chance === 0 ? "Always" : `1/${ore.chance.toLocaleString()}`;
    let tierClass = `rarity-${ore.cssClass}`;
    oreInfoBox.innerHTML = `
        <span class="${tierClass}" style="font-weight:bold; font-size: 1rem;">${ore.name}</span><br>
        <span style="color: var(--text-muted);">Tier:</span> <span class="${tierClass}">${ore.tier}</span> &bull; 
        <span style="color: var(--text-muted);">Chance:</span> <span style="color:var(--accent-blue);">${chanceText}</span> &bull; 
        <span style="color: var(--text-muted);">Value:</span> <span style="color:var(--accent-green);">$${ore.money}</span>
    `;
}

oreInfoSelect.onchange = function() {
    let list = currentLayer == 2 ? [lavaLayerBlock, ...lavaOres] : (currentLayer == 3 ? basaltOres : ores);
    showOreInfo(list[this.value]);
};

let autoMining = false;
let autoInterval = null;

document.getElementById("layerSelect").onchange = function() {
    currentLayer = parseInt(this.value);
    fillOreDropdown(currentLayer);
    output.innerHTML = "";
    saveData();
    if(autoMining){
        autoMining = false;
        clearInterval(autoInterval);
        autoInterval = null;
        document.getElementById("autoBtn").textContent = "Auto Mine";
    }
};

function rollVariants() {
    let rolled = [];
    let mult = 1;
    variants.forEach(v => {
        if(Math.random()*v.chance < 1){
            rolled.push(v.name);
            mult *= v.multiplier;
        }
    });
    return {rolled, mult};
}

function mineOnce(customLuck = null) {
    let oreList = currentLayer == 2 ? [lavaLayerBlock, ...lavaOres] : (currentLayer == 3 ? basaltOres : ores);
    let effectiveLuck = customLuck !== null ? customLuck : getTotalLuck();

    for(let i=oreList.length-1; i>=0; i--){
        let effectiveChance = oreList[i].chance > 0 ? oreList[i].chance / effectiveLuck : 0;
        if(effectiveChance > 0 && Math.random()*effectiveChance < 1){
            const {rolled, mult} = rollVariants();
            const earned = oreList[i].money*mult;
            money += earned;
            blocksMined++;
            return {oreName: oreList[i].name, tier: oreList[i].tier, cssClass: oreList[i].cssClass, earned, totalMoney: money, variants: rolled};
        }
    }
    
    let defaultOre = oreList.find(o => o.chance === 0) || {name:"Stone", money:5, tier:"Layer", cssClass:"layer"};
    money += defaultOre.money;
    blocksMined++;
    return {oreName: defaultOre.name, tier: defaultOre.tier, cssClass: defaultOre.cssClass, earned: defaultOre.money, totalMoney: money, variants: []};
}

function renderResult(res, minedBy = "") {
    const span = document.createElement("div");
    let classes = [];
    if(res.variants.includes("gold")) classes.push("gold");
    if(res.variants.includes("silver")) classes.push("silver");
    if(res.variants.includes("ionized")) classes.push("ionized");
    if(res.variants.includes("quantum")) classes.push("quantum");
    
    let variantText = res.variants.length > 0 ? ` (${res.variants.join("+")})` : "";
    let abilityText = minedBy ? ` {mined by ${minedBy}}` : "";
    span.className = classes.join(" ");
    span.innerHTML = `> Mined <span class="rarity-${res.cssClass}">${res.oreName}</span>${variantText} [${res.tier}] <span style="color:var(--accent-green)">+$${Math.floor(res.earned)}</span>${abilityText}`;
    output.appendChild(span);

    while(output.childNodes.length>200) output.removeChild(output.firstChild);
    output.scrollTop = output.scrollHeight;

    moneyDiv.textContent = `$${Math.floor(res.totalMoney).toLocaleString()}`;
    blocksMinedDiv.textContent = blocksMined.toLocaleString();

    updateLeaderboard(res.oreName, res.tier);
    updateInventory(res.oreName, res.variants);
    saveData();
}

function getOreInfo(name) {
    let found = ores.find(o => o.name === name)
        || lavaOres.find(o => o.name === name)
        || basaltOres.find(o => o.name === name);
    if (found) return found;
    if (name === "Lava") return lavaLayerBlock;
    return null;
}

function updateLeaderboard(oreName) {
    const info = getOreInfo(oreName);
    if (!info || info.chance === 0) return;
    if (leaderboard.some(e => e.name === oreName)) return;
    leaderboard.push({name: oreName, tier: info.tier, cssClass: info.cssClass, chance: info.chance, time: Date.now()});
    leaderboard.sort((a, b) => b.chance - a.chance || a.time - b.time);
    if (leaderboard.length > 10) leaderboard.length = 10;
    renderLeaderboard();
    saveData();
}

function renderLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";
    leaderboard.forEach((entry) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="rarity-${entry.cssClass}">${entry.name}</span> 
            <span style="color:var(--text-muted);">[${entry.tier}]</span> 
            <span style="color:var(--accent-blue);">1/${entry.chance.toLocaleString()}</span>`;
        list.appendChild(li);
    });
    if (list.childNodes.length === 0) {
        list.innerHTML = "<li style='color:var(--text-muted); list-style:none;'>No rare ores mined yet.</li>";
    }
}

function updateInventory(oreName, variantsArr) {
    if (!inventory[oreName]) {
        inventory[oreName] = {count:0, variants:{plain:0,gold:0,silver:0,ionized:0,quantum:0}};
    }
    inventory[oreName].count += 1;
    if (variantsArr && variantsArr.length) {
        variantsArr.forEach(v => {
            inventory[oreName].variants[v] += 1;
        });
    } else {
        inventory[oreName].variants.plain += 1;
    }
    renderInventory();
    saveData();
}

function toggleVariantView(oreName) {
    variantToggles[oreName] = !variantToggles[oreName];
    const panel = document.getElementById(`variants-${oreName}`);
    if (panel) {
        panel.style.display = variantToggles[oreName] ? "block" : "none";
    }
}

document.getElementById("expandAllVariantsBtn").onclick = () => {
    const keys = Object.keys(inventory);
    if (keys.length === 0) return;
    const allOpen = keys.every(k => variantToggles[k]);
    keys.forEach(k => {
        variantToggles[k] = !allOpen;
    });
    renderInventory();
};

function renderInventory() {
    const container = document.getElementById("inventoryList");
    container.innerHTML = "";

    const keys = Object.keys(inventory).sort();
    if (keys.length === 0) {
        container.innerHTML = "<div style='color:var(--text-muted); font-size:0.875rem; text-align:center; padding: 20px 0;'>No ores collected.</div>";
        return;
    }

    keys.forEach(name => {
        const info = getOreInfo(name);
        if (!info) return;
        const data = inventory[name];
        const v = data.variants;
        const isOpen = !!variantToggles[name];

        const itemDiv = document.createElement("div");
        itemDiv.className = "inv-item";

        itemDiv.innerHTML = `
            <div class="inv-item-row" onclick="toggleVariantView('${name}')">
                <span class="inv-item-name rarity-${info.cssClass}">${name}</span>
                <div>
                    <span class="inv-item-count">${data.count.toLocaleString()}</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 4px;">${isOpen ? '▲' : '▼'}</span>
                </div>
            </div>
            <div class="inv-variants-panel" id="variants-${name}" style="display: ${isOpen ? 'block' : 'none'};">
                <div class="variant-grid">
                    <div>Plain: <b>${v.plain}</b></div>
                    <div class="gold">Gold: <b>${v.gold}</b></div>
                    <div class="silver">Silver: <b>${v.silver}</b></div>
                    <div class="ionized">Ionized: <b>${v.ionized}</b></div>
                    <div class="quantum">Quantum: <b>${v.quantum}</b></div>
                </div>
            </div>
        `;
        container.appendChild(itemDiv);
    });
}

let miningSpeed = 50;
function getEffectiveMiningSpeed() {
    return gears.speedCoil ? miningSpeed - 10 : miningSpeed;
}
const speedDisplay = document.getElementById("speedDisplay");
function updateSpeedDisplay() {
    speedDisplay.textContent = `${getEffectiveMiningSpeed()}ms`;
}

let luck = 1;
const luckInput = document.getElementById("luckInput");
const luckDisplay = document.getElementById("luckDisplay");

luckInput.oninput = function() {
    luck = Math.max(1, parseFloat(this.value) || 1);
    luckDisplay.textContent = `${luck}x`;
    updateSpeedDisplay();
};

const pickaxeInfo = document.getElementById("pickaxeInfo");
const stonePickaxeReq = { stone: 100, copper: 50, money: 500 };

function stoneRavageProc() {
    return Math.random() * 250 < 1;
}

const stonePickaxeDescription = "+1.05x Base Luck | Stone Ravage (1/250) mines 16 ores instantly.";

function updatePickaxeInfo() {
    if (pickaxe === "stone") {
        pickaxeInfo.textContent = "Stone Pickaxe Equipped: " + stonePickaxeDescription;
    } else {
        pickaxeInfo.textContent = "Craft the Stone Pickaxe in the Blacksmith for bonuses.";
    }
}

function showNotification(msg) {
    const notification = document.getElementById("notification");
    notification.textContent = msg;
    notification.style.display = "block";
    setTimeout(() => {
        notification.style.display = "none";
    }, 2000);
}

function executeMiningAction() {
    if (pickaxe === "stone" && stoneRavageProc()) {
        for(let i=0;i<16;i++) renderResult(mineOnce(getTotalLuck()), "Stone Ravage");
        showNotification("Stone Ravage Activated! (16x)");
    } else {
        renderResult(mineOnce());
    }
}

document.getElementById("mineBtn").onclick = () => {
    executeMiningAction();
};

document.getElementById("autoBtn").onclick = () => {
    autoMining = !autoMining;
    if(autoMining){
        document.getElementById("autoBtn").textContent = "Stop Auto";
        document.getElementById("autoBtn").style.background = "var(--accent-red)";
        autoInterval = setInterval(()=>{
            executeMiningAction();
        }, getEffectiveMiningSpeed());
    } else {
        document.getElementById("autoBtn").textContent = "Auto Mine";
        document.getElementById("autoBtn").style.background = "var(--accent-gold)";
        clearInterval(autoInterval);
        autoInterval=null;
    }
    updateSpeedDisplay();
};

document.getElementById("clearBtn").onclick = () => {
    output.innerHTML = "";
};

const blacksmithToggle = document.getElementById("blacksmithToggle");
const blacksmithPanel = document.getElementById("blacksmithPanel");
const closeBlacksmith = document.getElementById("closeBlacksmith");
const buyStonePickaxeBlacksmith = document.getElementById("buyStonePickaxeBlacksmith");
const blacksmithPickaxeInfo = document.getElementById("blacksmithPickaxeInfo");

blacksmithToggle.onclick = () => {
    renderBlacksmith();
    blacksmithPanel.style.display = "block";
};
closeBlacksmith.onclick = () => { blacksmithPanel.style.display = "none"; };

function renderBlacksmith() {
    const stoneOwned = inventory["Stone"]?.count || 0;
    const copperOwned = inventory["Copper"]?.count || 0;
    const moneyOwned = money;
    document.getElementById("stoneOwned").textContent = stoneOwned;
    document.getElementById("copperOwned").textContent = copperOwned;
    document.getElementById("moneyOwned").textContent = `$${Math.floor(moneyOwned)}`;

    const stonePercent = Math.min(100, Math.floor((stoneOwned/stonePickaxeReq.stone)*100));
    const copperPercent = Math.min(100, Math.floor((copperOwned/stonePickaxeReq.copper)*100));
    const moneyPercent = Math.min(100, Math.floor((moneyOwned/stonePickaxeReq.money)*100));
    document.getElementById("stonePercent").textContent = stonePercent + "%";
    document.getElementById("copperPercent").textContent = copperPercent + "%";
    document.getElementById("moneyPercent").textContent = moneyPercent + "%";

    const overall = Math.floor((stonePercent + copperPercent + moneyPercent)/3);
    document.getElementById("stonePickaxeProgressLabel").textContent = `Recipe Progress: ${overall}%`;
    document.getElementById("stonePickaxeProgressBar").style.width = overall + "%";

    if (pickaxe === "stone") {
        blacksmithPickaxeInfo.textContent = "Already Crafted! Benefit: " + stonePickaxeDescription;
        buyStonePickaxeBlacksmith.disabled = true;
        buyStonePickaxeBlacksmith.style.opacity = 0.5;
    } else {
        blacksmithPickaxeInfo.textContent = "Requires 100 Stone, 50 Copper, $500.";
        buyStonePickaxeBlacksmith.disabled = false;
        buyStonePickaxeBlacksmith.style.opacity = 1;
    }
}

buyStonePickaxeBlacksmith.onclick = function() {
    const stoneOwned = inventory["Stone"]?.count || 0;
    const copperOwned = inventory["Copper"]?.count || 0;
    const moneyOwned = money;
    if (
        stoneOwned >= stonePickaxeReq.stone &&
        copperOwned >= stonePickaxeReq.copper &&
        moneyOwned >= stonePickaxeReq.money
    ) {
        money -= stonePickaxeReq.money;
        inventory["Stone"].count -= stonePickaxeReq.stone;
        inventory["Copper"].count -= stonePickaxeReq.copper;
        pickaxe = "stone";
        updatePickaxeInfo();
        moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
        renderInventory();
        renderBlacksmith();
        saveData();
        showNotification("Crafted Stone Pickaxe!");
    } else {
        showNotification("Missing required materials!");
    }
};

const gearsToggle = document.getElementById("gearsToggle");
const gearsPanel = document.getElementById("gearsPanel");
const closeGears = document.getElementById("closeGears");
const craftSpeedCoil = document.getElementById("craftSpeedCoil");
const speedCoilStatus = document.getElementById("speedCoilStatus");

gearsToggle.onclick = () => {
    renderGears();
    gearsPanel.style.display = "block";
};
closeGears.onclick = () => { gearsPanel.style.display = "none"; };

function renderGears() {
    if (gears.speedCoil) {
        speedCoilStatus.textContent = "Status: Crafted & Active";
        craftSpeedCoil.disabled = true;
        craftSpeedCoil.style.opacity = 0.5;
    } else {
        speedCoilStatus.textContent = "Status: Not Owned";
        craftSpeedCoil.disabled = false;
        craftSpeedCoil.style.opacity = 1;
    }
    updateSpeedDisplay();
}

craftSpeedCoil.onclick = function() {
    if (money >= 1000 && !gears.speedCoil) {
        money -= 1000;
        gears.speedCoil = true;
        renderGears();
        moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
        saveData();
        showNotification("Crafted Speed Coil!");
    } else if (gears.speedCoil) {
        showNotification("Already crafted!");
    } else {
        showNotification("Not enough money!");
    }
};

fillOreDropdown(currentLayer);
updatePickaxeInfo();
renderLeaderboard();
renderInventory();
renderBlacksmith();
renderGears();
updateSpeedDisplay();
blocksMinedDiv.textContent = blocksMined.toLocaleString();
moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
</script>
</body>
</html>
