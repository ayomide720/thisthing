<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mining Game</title>
<style>
    :root {
        --bg-color: #0d0f12;
        --card-bg: #161920;
        --card-border: #232733;
        --text-main: #f0f3f8;
        --text-muted: #8a94a6;
        --accent-gold: #fbbf24;
        --accent-blue: #38bdf8;
        --accent-green: #4ade80;
        --accent-purple: #c084fc;
        --accent-red: #f87171;
        --btn-bg: #222734;
        --btn-hover: #2d3446;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .main-wrapper {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 1000px;
        align-items: flex-start;
    }

    .container {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        flex: 1;
        min-width: 0;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        position: relative;
    }

    .inventory-sidebar {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        width: 360px;
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        max-height: 85vh;
    }

    .inventory-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--card-border);
    }

    .inventory-header h2 { font-size: 1.125rem; }

    .inventory-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
    }

    .inventory-controls input, .inventory-controls select {
        width: 100%;
    }

    .inventory-scroll {
        overflow-y: auto;
        flex: 1;
        padding-right: 4px;
    }

    .nav-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }

    .nav-btn {
        flex: 1;
        padding: 10px;
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .nav-btn:hover {
        background: var(--btn-hover);
        border-color: #3b4254;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
    }

    .stat-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--card-border);
        padding: 12px;
        border-radius: 10px;
        text-align: center;
    }

    .stat-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 1.25rem;
        font-weight: 700;
    }

    #money { color: var(--accent-gold); }
    #blocksMined { color: var(--accent-blue); }

    .controls-panel {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.875rem;
    }

    input[type="text"], input[type="number"], select {
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        padding: 8px 12px;
        border-radius: 6px;
        outline: none;
        font-size: 0.875rem;
    }

    input[type="number"] { width: 70px; text-align: center; }
    select { width: 100%; cursor: pointer; }

    .badge {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: rgba(255, 255, 255, 0.05);
        padding: 4px 8px;
        border-radius: 4px;
    }

    #oreInfoBox {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 0.875rem;
        line-height: 1.5;
    }

    #leaderboardBox {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 14px;
        margin-top: 16px;
    }

    #leaderboardBox b {
        display: block;
        font-size: 0.875rem;
        margin-bottom: 8px;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    #leaderboardList { padding-left: 20px; font-size: 0.875rem; }
    #leaderboardList li { margin-bottom: 4px; }

    .action-row {
        display: grid;
        grid-template-columns: 2fr 2fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
    }

    .action-btn {
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    #mineBtn { background: var(--accent-blue); color: #000; }
    #mineBtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #autoBtn { background: var(--accent-gold); color: #000; }
    #autoBtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #clearBtn { background: var(--btn-bg); color: var(--text-muted); border: 1px solid var(--card-border); }

    .reset-btn {
        width: 100%;
        margin-top: 16px;
        background: rgba(248, 113, 113, 0.1);
        color: var(--accent-red);
        border: 1px solid var(--accent-red);
        padding: 8px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .reset-btn:hover {
        background: var(--accent-red);
        color: #000;
    }

    #output {
        background: #090a0f;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px;
        height: 180px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.8125rem;
        line-height: 1.6;
        color: var(--text-muted);
    }

    .panel {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--card-bg);
        border-radius: 16px;
        z-index: 100;
        padding: 24px;
        overflow-y: auto;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--card-border);
    }

    .close-btn {
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
    }

    .inv-item { border-bottom: 1px solid var(--card-border); padding: 8px 0; }
    .inv-item-row { display: flex; justify-content: space-between; cursor: pointer; }
    .inv-variants-panel { display: none; background: rgba(0,0,0,0.25); border-radius: 6px; padding: 8px; margin-top: 6px; font-size: 0.75rem; }
    .variant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

    #notification {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--btn-hover);
        color: var(--text-main);
        border: 1px solid var(--accent-blue);
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 0.875rem;
        display: none;
        z-index: 999;
    }

    .craft-card {
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
    }

    .ability-badge {
        display: inline-block;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 4px;
        margin-top: 4px;
        background: rgba(255,255,255,0.08);
        color: var(--accent-blue);
    }

    .gold { color: var(--accent-gold); font-weight: bold; }
    .silver { color: #cbd5e1; font-weight: bold; }
    .ionized { color: var(--accent-blue); font-weight: bold; }
    .quantum { color: var(--accent-purple); font-weight: bold; }
    
    .rarity-common { color: var(--accent-green); }
    .rarity-uncommon { color: #2dd4bf; }
    .rarity-rare { color: var(--accent-blue); }
    .rarity-master { color: var(--accent-purple); }
    .rarity-surreal { color: #f472b6; }
    .rarity-mythic { color: var(--accent-gold); }
    .rarity-exotic { color: #fb923c; }
    .rarity-exquisite { color: #e879f9; }
    .rarity-transcendent { color: #a855f7; }
    .rarity-enigmatic { color: #f43f5e; }
    .rarity-unfathomable { color: #6366f1; }
    .rarity-cosmic { color: #38bdf8; font-weight: bold; }
    .rarity-divine { color: #facc15; font-weight: bold; }
    .rarity-infinite { color: #ec4899; font-weight: bold; }
    .rarity-layer { color: var(--text-muted); }
    .rarity-lava { color: var(--accent-red); }
</style>
</head>

<div class="main-wrapper">
    <div class="container">
        <div class="nav-bar">
            <button class="nav-btn" id="blacksmithToggle">Blacksmith (Pickaxes)</button>
            <button class="nav-btn" id="gearsToggle">Gears Workbench</button>
        </div>

        <div id="blacksmithPanel" class="panel">
            <div class="panel-header">
                <h2>Blacksmith - Pickaxes</h2>
                <button class="close-btn" id="closeBlacksmith">Close</button>
            </div>
            <div id="pickaxeListContainer"></div>
        </div>

        <div id="gearsPanel" class="panel">
            <div class="panel-header">
                <h2>Gears Workbench</h2>
                <button class="close-btn" id="closeGears">Close</button>
            </div>
            <div id="gearsListContainer"></div>
        </div>

        <div class="header">
            <h1>⛏️ Mining Simulator</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Balance</div>
                    <div class="stat-value" id="money">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Blocks Mined</div>
                    <div class="stat-value" id="blocksMined">0</div>
                </div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="control-row">
                <label for="luckInput" style="font-weight:600;">Luck Multiplier</label>
                <div>
                    <input id="luckInput" type="number" min="1" step="0.01" value="1">
                    <span class="badge" id="luckDisplay">1x</span>
                </div>
            </div>
            <div class="control-row">
                <span style="font-weight:600;">Mining Speed</span>
                <span class="badge" id="speedDisplay">50ms</span>
            </div>
        </div>

        <div id="pickaxeInfo" style="font-size:0.8125rem; color: var(--accent-green); margin-bottom: 12px; text-align: center;"></div>

        <select id="layerSelect" style="margin-bottom:12px;">
            <option value="1">Layer 1 (Normal)</option>
            <option value="2">Layer 2 (Lava Layer)</option>
            <option value="3">Layer 3 (Basalt Layer) - Req: 5k Blocks</option>
            <option value="4">Layer 4 (Crystal Caverns) - Req: 100k Blocks</option>
            <option value="5">Layer 5 (Quantum Void) - Req: 1M Blocks</option>
        </select>

        <div class="control-row" style="margin-bottom: 6px;">
            <label for="oreInfoSelect" style="font-size:0.75rem; color: var(--text-muted); text-transform:UPPERCASE;">Ore Index</label>
        </div>
        <select id="oreInfoSelect" style="margin-bottom:12px;"></select>
        
        <div id="oreInfoBox"></div>

        <div class="action-row">
            <button class="action-btn" id="mineBtn">Mine 1x</button>
            <button class="action-btn" id="autoBtn">Auto Mine</button>
            <button class="action-btn" id="clearBtn">Clear</button>
        </div>

        <div id="output"></div>
        
        <button class="reset-btn" id="resetDataBtn">⚠️ Reset All Data</button>
        <div id="notification">Notification message</div>
    </div>

    <div class="inventory-sidebar">
        <div class="inventory-header">
            <h2>📦 Inventory</h2>
            <button class="close-btn" id="expandAllVariantsBtn" style="font-size:0.75rem;">Toggle Variants</button>
        </div>
        
        <div class="inventory-controls">
            <input type="text" id="inventorySearch" placeholder="Search ores...">
            <select id="inventorySort">
                <option value="name">Sort by Name</option>
                <option value="count">Sort by Quantity (High -> Low)</option>
                <option value="rarity">Sort by Rarity (High -> Low)</option>
            </select>
        </div>

        <div class="inventory-scroll" id="inventoryList"></div>

        <div id="leaderboardBox">
            <b>Rarest Ore Leaderboard</b>
            <ol id="leaderboardList"></ol>
        </div>
    </div>
</div>

function saveData() {
    localStorage.setItem("mining_leaderboard", JSON.stringify(leaderboard));
    localStorage.setItem("mining_inventory", JSON.stringify(inventory));
    localStorage.setItem("mining_money", money);
    localStorage.setItem("mining_pickaxe", pickaxe);
    localStorage.setItem("mining_blocksMined", blocksMined);
    localStorage.setItem("mining_gears", JSON.stringify(gears));
}

function loadData() {
    const lb = localStorage.getItem("mining_leaderboard");
    const inv = localStorage.getItem("mining_inventory");
    leaderboard = lb ? JSON.parse(lb) : [];
    inventory = inv ? JSON.parse(inv) : {};
    money = Number(localStorage.getItem("mining_money")) || 0;
    pickaxe = localStorage.getItem("mining_pickaxe") || "none";
    blocksMined = Number(localStorage.getItem("mining_blocksMined")) || 0;
    const g = localStorage.getItem("mining_gears");
    if (g) gears = Object.assign(gears, JSON.parse(g));
    
    if (!pickaxeDefinitions.some(p => p.id === pickaxe)) {
        pickaxe = "none";
    }
}

function resetData() {
    if (confirm("Are you sure you want to reset all game data? This cannot be undone!")) {
        localStorage.clear();
        leaderboard = [];
        inventory = {};
        money = 0;
        pickaxe = "none";
        blocksMined = 0;
        gears = {
            speedCoil: false,
            flashGrenade: false
        };
        location.reload();
    }
}

function triggerIronSpirit(isVariant = false) {
    let boost = isVariant ? 0.05 : 0.01;
    ironSpiritBonus = Math.min(1.0, ironSpiritBonus + boost);
    if (ironSpiritTimer) clearTimeout(ironSpiritTimer);
    ironSpiritTimer = setTimeout(() => {
        ironSpiritBonus = 0;
        luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;
    }, 3000);
    luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;
}

function rollVariants() {
    let rolled = [];
    let mult = 1;
    let modChance = 1;
    let extraMult = 0.0;

    variants.forEach(v => {
        if(Math.random() * (v.chance / modChance) < 1){
            rolled.push(v.name);
            mult *= (v.multiplier + extraMult);
        }
    });
    return {rolled, mult};
}

// Bulk Mining Engine for High-Performance Multi-Block Drops
if (pickaxe === "t2_quartz") {
            if (selectedOre.name === "Quartz") {
                crystalResonanceCharges = Math.min(10, crystalResonanceCharges + 1);
                if (resonanceTimer) clearTimeout(resonanceTimer);
                resonanceTimer = setTimeout(() => {
                    crystalResonanceCharges = 0;
                    luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;
                }, 4000); // Decays after 4 seconds of not mining quartz
            }

            // Charge progress for Quartz Overload (fills every 200 blocks)
            if (!quartzOverloadActive) {
                quartzChargeProgress++;
                if (quartzChargeProgress >= 200) {
                    quartzChargeProgress = 0;
                    triggerQuartzOverload();
                }
            }
        }

    let oreList;
    if (currentLayer == 2) oreList = [lavaLayerBlock, ...lavaOres];
    else if (currentLayer == 3) oreList = basaltOres;
    else if (currentLayer == 4) oreList = crystalOres;
    else if (currentLayer == 5) oreList = quantumOres;
    else oreList = ores;

    let effectiveLuck = overrideLuck !== null ? overrideLuck : getEffectiveLuck();

    let totalEarned = 0;
    let summary = {};
    let rarestRolled = null;

    for (let c = 0; c < count; c++) {
        let selectedOre = null;
        for (let i = oreList.length - 1; i >= 0; i--) {
            let effectiveChance = oreList[i].chance > 0 ? oreList[i].chance / effectiveLuck : 0;
            if (effectiveChance > 0 && Math.random() * effectiveChance < 1) {
                selectedOre = oreList[i];
                break;
            }
        }

        if (!selectedOre) {
            selectedOre = oreList.find(o => o.chance === 0) || oreList[0];
        }

        if (pickaxe === "t2_iron" && selectedOre.name === "Iron") {
            const tempVariants = rollVariants();
            triggerIronSpirit(tempVariants.rolled.length > 0);
        }

        const {rolled, mult} = rollVariants();
        let earned = selectedOre.money * mult;

        let dropMultiplier = 1;
        if (isFlashBomb && selectedOre.chance > 0 && selectedOre.chance < 100 && selectedOre.tier !== "Layer" && selectedOre.tier !== "Lava") {
            dropMultiplier = 2;
        }

        totalEarned += earned * dropMultiplier;

        if (!summary[selectedOre.name]) {
            summary[selectedOre.name] = { count: 0, tier: selectedOre.tier, info: selectedOre };
        }
        summary[selectedOre.name].count += dropMultiplier;

        if (!rarestRolled || selectedOre.chance > rarestRolled.chance) {
            rarestRolled = selectedOre;
        }

        // Inventory aggregate
        if (!inventory[selectedOre.name]) {
            inventory[selectedOre.name] = {count:0, variants:{plain:0,gold:0,silver:0,ionized:0,quantum:0}};
        }
        inventory[selectedOre.name].count += dropMultiplier;
        if (rolled.length > 0) {
            rolled.forEach(v => { inventory[selectedOre.name].variants[v] += dropMultiplier; });
        } else {
            inventory[selectedOre.name].variants.plain += dropMultiplier;
        }
        updateLeaderboard(selectedOre.name, mult);
    }

    money += totalEarned;
    blocksMined += count;

    return { totalEarned, summary, rarestRolled, count };
}

function renderBulkResult(bulkData, causeTitle) {
    const span = document.createElement("div");
    let rarestInfo = bulkData.rarestRolled ? ` Top Drop: <span class="rarity-${bulkData.rarestRolled.tier.toLowerCase()}">${bulkData.rarestRolled.name}</span>` : "";
    
    span.innerHTML = `> ⚡ <b>${causeTitle}</b> Mined <b>${bulkData.count.toLocaleString()}</b> blocks! <span style="color:var(--accent-green)">+$${Math.floor(bulkData.totalEarned).toLocaleString()}</span> | ${rarestInfo}`;
    output.appendChild(span);

    while(output.childNodes.length > 200) output.removeChild(output.firstChild);
    output.scrollTop = output.scrollHeight;

    moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
    blocksMinedDiv.textContent = blocksMined.toLocaleString();

    renderInventory();
    saveData();
}

function getOreInfo(name) {
    if (name === "StoneBlock") return {name:"StoneBlock", chance:1, money:5, tier:"Layer"};
    if (name === "Lava") return {name:"Lava", chance:0, money:5, tier:"Lava"};
    if (name === "Basalt") return {name:"Basalt", chance:0, money:5, tier:"Layer"};
    if (name === "Crystal Shard") return {name:"Crystal Shard", chance:0, money:25, tier:"Layer"};
    if (name === "Void Matter") return {name:"Void Matter", chance:0, money:100, tier:"Layer"};
    return ores.find(o => o.name === name) || lavaOres.find(o => o.name === name) || basaltOres.find(o => o.name === name) || crystalOres.find(o => o.name === name) || quantumOres.find(o => o.name === name);
}

function updateLeaderboard(oreName, variantMultiplier = 1) {
    const info = getOreInfo(oreName);
    if (!info || info.name === "StoneBlock" || info.name === "Lava" || info.name === "Basalt" || info.name === "Crystal Shard" || info.name === "Void Matter") return;
    
    const adjustedChance = info.chance * variantMultiplier;

    const existingIdx = leaderboard.findIndex(e => e.name === oreName);
    if (existingIdx !== -1) {
        if (adjustedChance > leaderboard[existingIdx].adjustedChance) {
            leaderboard[existingIdx].adjustedChance = adjustedChance;
            leaderboard[existingIdx].variantMult = variantMultiplier;
        }
    } else {
        leaderboard.push({name: oreName, tier: info.tier, chance: info.chance, adjustedChance: adjustedChance, variantMult: variantMultiplier, time: Date.now()});
    }

    leaderboard.sort((a, b) => b.adjustedChance - a.adjustedChance || a.time - b.time);
    if (leaderboard.length > 10) leaderboard.length = 10;
    renderLeaderboard();
}

function renderLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";
    leaderboard.forEach((entry) => {
        const li = document.createElement("li");
        let extraTag = entry.variantMult > 1 ? ` <span style="color:var(--accent-gold); font-size: 0.75rem;">(${entry.variantMult}x Var)</span>` : '';
        li.innerHTML = `<span class="rarity-${entry.tier.toLowerCase()}">${entry.name}</span>${extraTag} 
            <span style="color:var(--text-muted);">[${entry.tier}]</span> 
            <span style="color:var(--accent-blue);">1/${Math.floor(entry.adjustedChance).toLocaleString()}</span>`;
        list.appendChild(li);
    });
    if (list.childNodes.length === 0) {
        list.innerHTML = "<li style='color:var(--text-muted); list-style:none;'>No rare ores mined yet.</li>";
    }
}

function toggleVariantView(oreName) {
    variantToggles[oreName] = !variantToggles[oreName];
    const panel = document.getElementById(`variants-${oreName}`);
    if (panel) panel.style.display = variantToggles[oreName] ? "block" : "none";
}

    const keys = Object.keys(inventory);
    if (keys.length === 0) return;
    const allOpen = keys.every(k => variantToggles[k]);
    keys.forEach(k => { variantToggles[k] = !allOpen; });
    renderInventory();
};

function renderInventory() {
    const container = document.getElementById("inventoryList");
    container.innerHTML = "";

    const filterText = document.getElementById("inventorySearch").value.toLowerCase();
    const sortBy = document.getElementById("inventorySort").value;

    let keys = Object.keys(inventory).filter(name => name.toLowerCase().includes(filterText));

    if (sortBy === "name") {
        keys.sort();
    } else if (sortBy === "count") {
        keys.sort((a, b) => inventory[b].count - inventory[a].count);
    } else if (sortBy === "rarity") {
        keys.sort((a, b) => {
            const infoA = getOreInfo(a);
            const infoB = getOreInfo(b);
            return (infoB ? infoB.chance : 0) - (infoA ? infoA.chance : 0);
        });
    }

    if (keys.length === 0) {
        container.innerHTML = "<div style='color:var(--text-muted); font-size:0.875rem; text-align:center; padding: 20px 0;'>No ores found.</div>";
        return;
    }

    keys.forEach(name => {
        const info = getOreInfo(name);
        if (!info) return;
        const data = inventory[name];
        const v = data.variants;
        const isOpen = !!variantToggles[name];

        const itemDiv = document.createElement("div");
        itemDiv.className = "inv-item";
        itemDiv.innerHTML = `
            <div class="inv-item-row" onclick="toggleVariantView('${name}')">
                <span class="inv-item-name rarity-${info.tier.toLowerCase()}">${name}</span>
                <div>
                    <span class="inv-item-count">${data.count.toLocaleString()}</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 4px;">${isOpen ? '▲' : '▼'}</span>
                </div>
            </div>
            <div class="inv-variants-panel" id="variants-${name}" style="display: ${isOpen ? 'block' : 'none'};">
                <div class="variant-grid">
                    <div>Plain: <b>${v.plain}</b></div>
                    <div class="gold">Gold: <b>${v.gold}</b></div>
                    <div class="silver">Silver: <b>${v.silver}</b></div>
                    <div class="ionized">Ionized: <b>${v.ionized}</b></div>
                    <div class="quantum">Quantum: <b>${v.quantum}</b></div>
                </div>
            </div>
        `;
        container.appendChild(itemDiv);
    });
}

let baseMiningSpeed = 200;
function getEffectiveMiningSpeed() {
    let speed = baseMiningSpeed;
    if (gears.speedCoil) speed -= 100;
    if (quartzOverloadActive) speed = Math.floor(speed / 2); // 2x speed boost
    return Math.max(5, speed);
}

function getEffectiveLuck() {
    let l = luck;
    if (pickaxe === "t2_iron") {
        l += ironSpiritBonus;
    }

    if (pickaxe === "t2_quartz") {
        l += 0.05; // Base passive modifier (+1.05x total)
        l += (crystalResonanceCharges * 0.02); // Crystal Resonance stack
        if (quartzOverloadActive) {
            l = 2.5; // Flat override during Overload
        }
    }

    let pDef = pickaxeDefinitions.find(p => p.id === pickaxe);
    if (pDef && pDef.abilities) {
        pDef.abilities.forEach(ab => {
            if (ab.type === "passive_luck") l += ab.bonusLuck;
        });
    }
    return l;
}

function handleMine(isManualClick = false) {
    let req = layerRequirements[currentLayer] || 0;
    if (blocksMined < req) {
        showNotification(`Requires ${req.toLocaleString()} blocks mined to unlock Layer ${currentLayer}!`);
        currentLayer = 1;
        document.getElementById("layerSelect").value = 1;
        fillOreDropdown(1);
        return;
    }

    let pDef = pickaxeDefinitions.find(p => p.id === pickaxe);
    let totalBlocksToMine = 1;

    if (isManualClick && pickaxe === "t2_iron") {
        if (Math.random() < 0.01) {
            totalBlocksToMine = 10;
            showNotification("💥 Click Warrior Triggered! Mining 10 ores!");
        }
    }

    if (pDef && pDef.abilities) {
        pDef.abilities.forEach(ab => {
            if (ab.type === "passive_step") {
                if ((blocksMined + 1) % ab.step === 0) {
                    totalBlocksToMine += ab.extraBlocks;
                }
            }
        });
    }

    let result = bulkMine(totalBlocksToMine);
    renderBulkResult(result, pDef ? pDef.name : "Hand Pick");

    if (gears.flashGrenade && (blocksMined % 2 === 0)) {
        if (Math.random() < 0.2) {
            let flashRes = bulkMine(30, 0.5, true);
            renderBulkResult(flashRes, "Flash Bomb Proc!");
            showNotification("💣 Flash Bomb Activated! (+30 ores)");
        }
    }

    if (pDef && pDef.abilities) {
        pDef.abilities.forEach(ab => {
            if (ab.type === "active_burst") {
                if (Math.random() < ab.proc) {
                    let forcedLuck = ab.forcedLuck !== undefined ? ab.forcedLuck : null;
                    let burstRes = bulkMine(ab.count, forcedLuck);
                    renderBulkResult(burstRes, `${ab.name} Proc!`);
                    showNotification(`💥 ${ab.name} Triggered! (+${ab.count} blocks)`);
                }
            }
        });
    }
}

};

function renderBlacksmith() {
    const container = document.getElementById("pickaxeListContainer");
    container.innerHTML = "";

    pickaxeDefinitions.forEach(p => {
        const isOwned = pickaxe === p.id;
        const card = document.createElement("div");
        card.className = "craft-card";
        
        let reqList = [];
        let canCraft = true;

        for (let item in p.req) {
            if (item === "money") {
                let has = money >= p.req.money;
                if (!has) canCraft = false;
                reqList.push(`Money: $${Math.floor(money).toLocaleString()} / $${p.req.money.toLocaleString()}`);
            } else {
                let hasCount = inventory[item]?.count || 0;
                if (hasCount < p.req[item]) canCraft = false;
                reqList.push(`${item}: ${hasCount} / ${p.req[item]}`);
            }
        }

        let abilitiesHtml = p.abilities.map(ab => `<span class="ability-badge">${ab.name}</span>`).join("");

        card.innerHTML = `
            <b>${p.name}</b>
            <div>${abilitiesHtml}</div>
            <div style="font-size:0.8125rem; color:var(--text-muted); margin:4px 0;">${p.desc}</div>
            <div style="font-size:0.75rem; margin-bottom:8px;">${reqList.join(" | ")}</div>
            <button class="nav-btn" ${isOwned ? "disabled" : ""} onclick="craftPickaxe('${p.id}')">
                ${isOwned ? "Equipped" : "Craft & Equip"}
            </button>
        `;
        container.appendChild(card);
    });
}

function craftPickaxe(id) {
    const p = pickaxeDefinitions.find(item => item.id === id);
    if (!p) return;

    for (let item in p.req) {
        if (item === "money") {
            if (money < p.req.money) return showNotification("Not enough money!");
        } else {
            if ((inventory[item]?.count || 0) < p.req[item]) return showNotification(`Missing ${item}!`);
        }
    }

    for (let item in p.req) {
        if (item === "money") money -= p.req.money;
        else inventory[item].count -= p.req[item];
    }

    pickaxe = id;
    updatePickaxeInfo();
    luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;
    moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
    renderInventory();
    renderBlacksmith();
    saveData();
    showNotification(`Crafted ${p.name}!`);
}

    function triggerQuartzOverload() {
    quartzOverloadActive = true;
    showNotification("💎 QUARTZ OVERLOAD ACTIVATED! 2x Speed & +2.5x Flat Luck!");
    updateSpeedDisplay();
    luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;

    if (quartzOverloadTimer) clearTimeout(quartzOverloadTimer);
    quartzOverloadTimer = setTimeout(() => {
        quartzOverloadActive = false;
        showNotification("Quartz Overload ended.");
        updateSpeedDisplay();
        luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;
    }, 10000); // Lasts 10 seconds
}

// Render Gears Workbench UI
const gearsToggle = document.getElementById("gearsToggle");
const gearsPanel = document.getElementById("gearsPanel");
const closeGears = document.getElementById("closeGears");

gearsToggle.onclick = () => {
    renderGears();
    gearsPanel.style.display = "block";
};
closeGears.onclick = () => { gearsPanel.style.display = "none"; };

function renderGears() {
    const container = document.getElementById("gearsListContainer");
    container.innerHTML = "";

    gearsDefinitions.forEach(g => {
        const isCrafted = gears[g.id];
        const card = document.createElement("div");
        card.className = "craft-card";

        let reqList = [`Cost: $${g.cost.toLocaleString()}`];
        let canCraft = money >= g.cost;

        for (let item in g.req) {
            let hasCount = inventory[item]?.count || 0;
            if (hasCount < g.req[item]) canCraft = false;
            reqList.push(`${item}: ${hasCount} / ${g.req[item]}`);
        }

        card.innerHTML = `
            <b>${g.name}</b>
            <div style="font-size:0.8125rem; color:var(--text-muted); margin:4px 0;">${g.desc}</div>
            <div style="font-size:0.75rem; margin-bottom:8px;">${reqList.join(" | ")}</div>
            <button class="nav-btn" ${isCrafted ? "disabled" : ""} onclick="craftGear('${g.id}')">
                ${isCrafted ? "Active" : "Craft Gear"}
            </button>
        `;
        container.appendChild(card);
    });
}

function craftGear(id) {
    const g = gearsDefinitions.find(item => item.id === id);
    if (!g || gears[id]) return;

    if (money < g.cost) return showNotification("Not enough money!");
    for (let item in g.req) {
        if ((inventory[item]?.count || 0) < g.req[item]) return showNotification(`Missing ${item}!`);
    }

    money -= g.cost;
    for (let item in g.req) {
        inventory[item].count -= g.req[item];
    }

    gears[id] = true;
    renderGears();
    updateSpeedDisplay();
    luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;
    moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
    renderInventory();
    saveData();
    showNotification(`Crafted ${g.name}!`);
}

fillOreDropdown(currentLayer);
updatePickaxeInfo();
renderLeaderboard();
renderInventory();
updateSpeedDisplay();
luckDisplay.textContent = `${getEffectiveLuck().toFixed(2)}x`;
blocksMinedDiv.textContent = blocksMined.toLocaleString();
moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
</script>
