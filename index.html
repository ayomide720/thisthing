<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mining Game</title>
<style>
    :root {
        --bg-color: #0d0f12;
        --card-bg: #161920;
        --card-border: #232733;
        --text-main: #f0f3f8;
        --text-muted: #8a94a6;
        --accent-gold: #fbbf24;
        --accent-blue: #38bdf8;
        --accent-green: #4ade80;
        --accent-purple: #c084fc;
        --accent-red: #f87171;
        --btn-bg: #222734;
        --btn-hover: #2d3446;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .main-wrapper {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 1000px;
        align-items: flex-start;
    }

    .container {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        flex: 1;
        min-width: 0;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        position: relative;
    }

    .inventory-sidebar {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        width: 360px;
        padding: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        max-height: 85vh;
    }

    .inventory-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--card-border);
    }

    .inventory-header h2 { font-size: 1.125rem; }

    .inventory-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
    }

    .inventory-controls input, .inventory-controls select {
        width: 100%;
    }

    .inventory-scroll {
        overflow-y: auto;
        flex: 1;
        padding-right: 4px;
    }

    .nav-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
    }

    .nav-btn {
        flex: 1;
        padding: 10px;
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .nav-btn:hover {
        background: var(--btn-hover);
        border-color: #3b4254;
    }

    .header {
        text-align: center;
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
    }

    .stat-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--card-border);
        padding: 12px;
        border-radius: 10px;
        text-align: center;
    }

    .stat-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 1.25rem;
        font-weight: 700;
    }

    #money { color: var(--accent-gold); }
    #blocksMined { color: var(--accent-blue); }

    .controls-panel {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.875rem;
    }

    input[type="text"], input[type="number"], select {
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        padding: 8px 12px;
        border-radius: 6px;
        outline: none;
        font-size: 0.875rem;
    }

    input[type="number"] { width: 70px; text-align: center; }
    select { width: 100%; cursor: pointer; }

    .badge {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: rgba(255, 255, 255, 0.05);
        padding: 4px 8px;
        border-radius: 4px;
    }

    #oreInfoBox {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 0.875rem;
        line-height: 1.5;
    }

    #leaderboardBox {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 14px;
        margin-top: 16px;
    }

    #leaderboardBox b {
        display: block;
        font-size: 0.875rem;
        color: var(--text-muted);
        text-transform: uppercase;
    }

    #leaderboardList { padding-left: 20px; font-size: 0.875rem; }
    #leaderboardList li { margin-bottom: 4px; }

    .action-row {
        display: grid;
        grid-template-columns: 2fr 2fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
    }

    .action-btn {
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    #mineBtn { background: var(--accent-blue); color: #000; }
    #mineBtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #autoBtn { background: var(--accent-gold); color: #000; }
    #autoBtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    #clearBtn { background: var(--btn-bg); color: var(--text-muted); border: 1px solid var(--card-border); }

    .reset-btn {
        width: 100%;
        margin-top: 16px;
        background: rgba(248, 113, 113, 0.1);
        color: var(--accent-red);
        border: 1px solid var(--accent-red);
        padding: 8px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .reset-btn:hover {
        background: var(--accent-red);
        color: #000;
    }

    #output {
        background: #090a0f;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 12px;
        height: 180px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.8125rem;
        line-height: 1.6;
        color: var(--text-muted);
    }

    .panel {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--card-bg);
        border-radius: 16px;
        z-index: 100;
        padding: 24px;
        overflow-y: auto;
    }

    .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--card-border);
    }

    .close-btn {
        background: var(--btn-bg);
        border: 1px solid var(--card-border);
        color: var(--text-main);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
    }

    .inv-item { border-bottom: 1px solid var(--card-border); padding: 8px 0; }
    .inv-item-row { display: flex; justify-content: space-between; cursor: pointer; }
    .inv-variants-panel { display: none; background: rgba(0,0,0,0.25); border-radius: 6px; padding: 8px; margin-top: 6px; font-size: 0.75rem; }
    .variant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

    #notification-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column-reverse;
        gap: 8px;
        z-index: 999;
        align-items: center;
        pointer-events: none;
    }

    .notification-bubble {
        background: var(--btn-hover);
        color: var(--text-main);
        border: 1px solid var(--accent-blue);
        padding: 10px 20px;
        border-radius: 30px;
        font-size: 0.875rem;
        opacity: 1;
        transition: opacity 0.5s ease, transform 0.5s ease;
        pointer-events: auto;
    }

    .notification-bubble.fade-out {
        opacity: 0;
        transform: translateY(10px);
    }

    .craft-card {
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
    }

    .ability-badge {
        display: inline-block;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 4px;
        margin-top: 4px;
        background: rgba(255,255,255,0.08);
        color: var(--accent-blue);
    }

    .gold { color: var(--accent-gold); font-weight: bold; }
    .silver { color: #cbd5e1; font-weight: bold; }
    .ionized { color: var(--accent-blue); font-weight: bold; }
    .quantum { color: var(--accent-purple); font-weight: bold; }
    .plain { color: var(--text-main); }
    
    .rarity-common { color: var(--accent-green); }
    .rarity-uncommon { color: #2dd4bf; }
    .rarity-rare { color: var(--accent-blue); }
    .rarity-master { color: var(--accent-purple); }
    .rarity-surreal { color: #f472b6; }
    .rarity-mythic { color: var(--accent-gold); }
    .rarity-exotic { color: #fb923c; }
    .rarity-exquisite { color: #e879f9; }
    .rarity-transcendent { color: #a855f7; }
    .rarity-enigmatic { color: #f43f5e; }
    .rarity-unfathomable { color: #6366f1; }
    
    @keyframes blackAndWhitePulse {
        0% { color: #000000; text-shadow: 0 0 5px rgba(255, 255, 255, 0.2); }
        50% { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }
        100% { color: #000000; text-shadow: 0 0 5px rgba(255, 255, 255, 0.2); }
    }

    @keyframes starTwinkle {
        0%, 100% { text-shadow: 0 0 2px #38bdf8, 0 0 8px #ffffff, 0 0 12px #38bdf8; }
        50% { text-shadow: 0 0 4px #38bdf8, 0 0 15px #ffffff, 0 0 22px #38bdf8; }
    }

    .rarity-zenith {
        animation: blackAndWhitePulse 2s ease-in-out infinite;
        font-weight: bold;
    }

    .rarity-cosmic {
        color: #38bdf8;
        font-weight: bold;
        animation: starTwinkle 1.5s ease-in-out infinite;
    }

    @keyframes rainbowGlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .rarity-unbound {
        background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
        animation: rainbowGlow 6s ease infinite;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }
    .rarity-layer { color: var(--text-muted); }
    .rarity-lava { color: var(--accent-red); }
</style>
</head>
<body>

<div class="main-wrapper">
    <div class="container">
        <div class="nav-bar">
            <button class="nav-btn" id="blacksmithToggle">Blacksmith (Pickaxes)</button>
            <button class="nav-btn" id="gearsToggle">Gears Workbench</button>
        </div>

        <div id="blacksmithPanel" class="panel">
            <div class="panel-header">
                <h2>Blacksmith - Pickaxes</h2>
                <button class="close-btn" id="closeBlacksmith">Close</button>
            </div>
            <div id="pickaxeListContainer"></div>
        </div>

        <div id="gearsPanel" class="panel">
            <div class="panel-header">
                <h2>Gears Workbench (Coils & Gear Mods)</h2>
                <button class="close-btn" id="closeGears">Close</button>
            </div>
            <div id="gearsListContainer"></div>
        </div>

        <div class="header">
            <h1>⛏️ Mining Simulator</h1>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Balance</div>
                    <div class="stat-value" id="money">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Blocks Mined</div>
                    <div class="stat-value" id="blocksMined">0</div>
                </div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="control-row">
                <label for="luckInput" style="font-weight:600;">Luck Multiplier</label>
                <div>
                    <input id="luckInput" type="number" min="1" step="0.01" value="1">
                    <span class="badge" id="luckDisplay">1x</span>
                </div>
            </div>
            <div class="control-row">
                <span style="font-weight:600;">Mining Speed</span>
                <span class="badge" id="speedDisplay">50ms</span>
            </div>
            
            <div class="control-row">
                <span style="font-weight:600;">Universal Proc Multiplier</span>
                <span class="badge" id="procDisplay">1.00x</span>
            </div>
            <div class="control-row">
                 <label for="procInput" style="font-weight:600;">Manual Proc Boost %</label>
                 <div>
                     <input id="procInput" type="number" min="0" max="200" step="1" value="0">
                 </div>
            </div>
        </div>

        <div id="pickaxeInfo" style="font-size:0.8125rem; color: var(--accent-green); margin-bottom: 8px; text-align: center;"></div>
        
        <!-- Visible Meter for Stack/Passive Pickaxes -->
        <div id="pickaxeMeterBox" style="display: none; background: rgba(0,0,0,0.2); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 0.8125rem;">
            <div id="meterTitle" style="font-weight: bold; margin-bottom: 4px; color: var(--accent-blue);"></div>
            <div style="background: rgba(255,255,255,0.05); border-radius: 4px; height: 10px; overflow: hidden; position: relative;">
                <div id="meterBar" style="background: var(--accent-blue); width: 0%; height: 100%; transition: width 0.1s ease;"></div>
            </div>
            <div id="meterText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; text-align: right;"></div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <select id="worldSelect" style="flex: 1;">
                <option value="1">World 1 (Unlocked)</option>
            </select>
            <select id="layerSelect" style="flex: 2;">
                <option value="1">Layer 1 (Normal)</option>
                <option value="2">Layer 2 (Lava Layer)</option>
                <option value="3">Layer 3 (Basalt Layer)</option>
                <option value="4">Layer 4 (Marble Layer)</option>
            </select>
        </div>

        <div class="control-row" style="margin-bottom: 6px;">
            <label for="oreInfoSelect" style="font-size:0.75rem; color: var(--text-muted); text-transform:UPPERCASE;">Ore Index</label>
        </div>
        <select id="oreInfoSelect" style="margin-bottom:12px;"></select>
        
        <div id="oreInfoBox"></div>

        <div class="action-row">
            <button class="action-btn" id="mineBtn">Mine 1x</button>
            <button class="action-btn" id="autoBtn">Auto Mine</button>
            <button class="action-btn" id="clearBtn">Clear</button>
        </div>

        <div id="output"></div>
        
        <!-- Testing Button to Get All Gear & Pickaxes -->
        <button class="nav-btn" id="devUnlockAllBtn" style="width: 100%; margin-top: 12px; background: rgba(56, 189, 248, 0.1); color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer;">🧪 Dev: Get All Gear & Pickaxes</button>

        <button class="reset-btn" id="resetDataBtn">⚠️ Reset All Data</button>
        <div id="notification-container"></div>
    </div>

    <div class="inventory-sidebar">
        <div class="inventory-header">
            <h2>📦 Inventory</h2>
            <button class="close-btn" id="expandAllVariantsBtn" style="font-size:0.75rem;">Toggle Variants</button>
        </div>
        
        <div class="inventory-controls">
            <input type="text" id="inventorySearch" placeholder="Search ores...">
            <select id="inventorySort">
                <option value="name">Sort by Name</option>
                <option value="count">Sort by Quantity (High -> Low)</option>
                <option value="rarity">Sort by Rarity (High -> Low)</option>
            </select>
        </div>

        <div class="inventory-scroll" id="inventoryList"></div>

        <div id="leaderboardBox">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <b>Rarest Ore Leaderboard</b>
                <button class="close-btn" id="lbVariantToggle" style="font-size:0.7rem; padding: 2px 8px;">Show Variants</button>
            </div>
            <ol id="leaderboardList"></ol>
        </div>
    </div>
</div>

<div id="recipePinBoard" style="display: none; position: fixed; left: 20px; top: 100px; width: 280px; background: var(--card-bg); border: 1px solid var(--accent-blue); border-radius: 12px; padding: 14px; z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.5); user-select: none;">
    <div id="pinHeader" style="display: flex; justify-content: space-between; align-items: center; cursor: move; margin-bottom: 8px; border-bottom: 1px solid var(--card-border); padding-bottom: 6px;">
        <b style="font-size: 0.875rem; color: var(--accent-blue);">📌 Pinned Recipe</b>
        <button onclick="unpinRecipe()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem;">&times;</button>
    </div>
    <div id="pinContent" style="font-size: 0.8125rem; display: flex; flex-direction: column; gap: 6px;"></div>
</div>

    localStorage.setItem("mining_equippedCoil", equippedCoil === null ? "" : equippedCoil);
    localStorage.setItem("mining_world", currentWorld);
    localStorage.setItem("mining_layer", currentLayer);
}

function loadData() {
    const lb = localStorage.getItem("mining_leaderboard");
    const inv = localStorage.getItem("mining_inventory");
    const unlocked = localStorage.getItem("mining_unlockedPickaxes");
    
    leaderboard = lb ? JSON.parse(lb) : [];
    inventory = inv ? JSON.parse(inv) : {};
    unlockedPickaxes = unlocked ? JSON.parse(unlocked) : ["t1_flint"];
    money = Number(localStorage.getItem("mining_money")) || 0;
    pickaxe = localStorage.getItem("mining_pickaxe") || "none";
    blocksMined = Number(localStorage.getItem("mining_blocksMined")) || 0;
    currentWorld = Number(localStorage.getItem("mining_world")) || 1;
    currentLayer = Number(localStorage.getItem("mining_layer")) || 1;
    
    const g = localStorage.getItem("mining_gears");
    if (g) gears = Object.assign(gears, JSON.parse(g));
    const savedSlots = localStorage.getItem("mining_gearSlots");
    if (savedSlots) gearSlots = Number(savedSlots);
    if (gearSlots > maxGearLimit) gearSlots = maxGearLimit;
    const co = localStorage.getItem("mining_coilsOwned");
    if (co) coilsOwned = Object.assign(coilsOwned, JSON.parse(co));
    const ec = localStorage.getItem("mining_equippedCoil");
    equippedCoil = (ec && ec.length > 0) ? ec : null;
    
    if (!pickaxeDefinitions.some(p => p.id === pickaxe)) {
        pickaxe = "none";
    }
}

function initMiningWorker() {
    const workerCode = `
        let timer = null;
        self.onmessage = function(e) {
            if (e.data.command === 'start') {
                if (timer) clearInterval(timer);
                timer = setInterval(() => {
                    self.postMessage('tick');
                }, e.data.interval);
            } else if (e.data.command === 'stop') {
                if (timer) clearInterval(timer);
                timer = null;
            }
        };
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    miningWorker = new Worker(URL.createObjectURL(blob));

    miningWorker.onmessage = function(e) {
        if (e.data === 'tick' && autoMining) {

    };
}

function getMeltFrenzyThreshold(frenzyAbility, volleyAbility) {
    let reduction = (volleyAbility ? volleyAbility.baseProc : 0) * frenzyAbility.baseThreshold;
    return Math.max(frenzyAbility.minThreshold, frenzyAbility.baseThreshold - reduction);
}

function triggerMeltingFrenzy(frenzyAbility) {
    meltFrenzyActive = true;
    meltMeter = 0;
    showNotification("🌋 Melting Frenzy Active! Magmatic Volley proc rate boosted to 100%!");
    updatePickaxeInfo();

    if (meltFrenzyTimer) clearTimeout(meltFrenzyTimer);
    meltFrenzyTimer = setTimeout(() => {
        meltFrenzyActive = false;
        meltFrenzyCooldownUntil = Date.now() + frenzyAbility.cooldown;
        showNotification("Melting Frenzy ended. Cooling down...");
        updatePickaxeInfo();
        updatePickaxeMeter();
    }, frenzyAbility.duration);
}

function rollVariants() {
    let rolled = [];
    let mult = 1;
    let modChance = 1;
    let extraMult = 0.0;

    variants.forEach(v => {
        if(Math.random() * (v.chance / modChance) < 1){
            rolled.push(v.name);
            mult *= (v.multiplier + extraMult);
        }
    });
    return {rolled, mult};
}

function bulkMine(count, overrideLuck = null, isFlashBomb = false) {
    let oreList;
    if (currentLayer == 2) oreList = [lavaLayerBlock, ...lavaOres];
    else if (currentLayer == 3) oreList = basaltOres;
    else if (currentLayer == 4) oreList = marbleOres;
    else oreList = ores;

    let effectiveLuck = overrideLuck !== null ? overrideLuck : AttributeSystem.getLuck();

    let totalEarned = 0;
    let summary = {};
    let rarestRolled = null;

    for (let c = 0; c < count; c++) {
        let selectedOre = null;
        for (let i = oreList.length - 1; i >= 0; i--) {
            let effectiveChance = oreList[i].chance > 0 ? oreList[i].chance / effectiveLuck : 0;
            if (effectiveChance > 0 && Math.random() * effectiveChance < 1) {
                selectedOre = oreList[i];
                break;
            }
        }

        if (!selectedOre) {
            selectedOre = oreList.find(o => o.chance === 0) || oreList[0];
        }

        if (pickaxe === "t2_quartz") {
            if (selectedOre.name === "Quartz") {
                crystalResonanceCharges = Math.min(10, crystalResonanceCharges + 1);
                if (resonanceTimer) clearTimeout(resonanceTimer);
                resonanceTimer = setTimeout(() => {
                    crystalResonanceCharges = 0;
                    luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
                    updatePickaxeMeter();
                }, 4000);
            }

            if (!quartzOverloadActive) {
                quartzChargeProgress++;
                if (quartzChargeProgress >= 200) {
                    quartzChargeProgress = 0;
                    triggerQuartzOverload();
                }
            }
        }

        if (pickaxe === "t2_iron" && selectedOre.name === "Iron") {
            const tempVariants = rollVariants();
            triggerIronSpirit(tempVariants.rolled.length > 0);
        }

        if (pickaxe === "t4_magma" && !meltFrenzyActive) {
            let pDef = pickaxeDefinitions.find(p => p.id === "t4_magma");
            let frenzyAbility = pDef.abilities.find(a => a.type === "melting_frenzy");
            let volleyAbility = pDef.abilities.find(a => a.type === "magmatic_volley");
            let gain = Math.min(selectedOre.chance / 10, frenzyAbility.meltCapPerOre);
            meltMeter += gain;

            let threshold = getMeltFrenzyThreshold(frenzyAbility, volleyAbility);
            if (meltMeter >= threshold && Date.now() >= meltFrenzyCooldownUntil) {
                triggerMeltingFrenzy(frenzyAbility);
            }
        }

        const {rolled, mult} = rollVariants();
        let earned = selectedOre.money * mult;

        if (equippedCoil === "iceCoil") {
            earned *= 1.07;
        }

        let dropMultiplier = 1;
        if (isFlashBomb && selectedOre.chance > 0 && selectedOre.chance < 100 && selectedOre.tier !== "Layer" && selectedOre.tier !== "Lava") {
            dropMultiplier = 2;
        }

        totalEarned += earned * dropMultiplier;

        if (!summary[selectedOre.name]) {
            summary[selectedOre.name] = { count: 0, tier: selectedOre.tier, info: selectedOre };
        }
        summary[selectedOre.name].count += dropMultiplier;

        if (!rarestRolled || selectedOre.chance > rarestRolled.chance) {
            rarestRolled = selectedOre;
        }

        if (!inventory[selectedOre.name]) {
            inventory[selectedOre.name] = {count:0, variants:{plain:0,gold:0,silver:0,ionized:0,quantum:0}};
        }
        inventory[selectedOre.name].count += dropMultiplier;
        if (rolled.length > 0) {
            rolled.forEach(v => { inventory[selectedOre.name].variants[v] += dropMultiplier; });
        } else {
            inventory[selectedOre.name].variants.plain += dropMultiplier;
        }
        updateLeaderboard(selectedOre.name, mult);
    }

    money += totalEarned;
    blocksMined += count;
    updatePickaxeMeter();

    return { totalEarned, summary, rarestRolled, count };
}

function getOreInfo(name) {
    if (name === "StoneBlock" || name === "Stone") return {name:"Stone", chance:0, money:layerValue, tier:"Layer"};
    if (name === "Lava") return {name:"Lava", chance:0, money:layerValue, tier:"Lava"};
    if (name === "Basalt") return {name:"Basalt", chance:0, money:layerValue, tier:"Layer"};
    if (name === "Marble") return {name:"Marble", chance:0, money:layerValue, tier:"Layer"};
    return ores.find(o => o.name === name) || lavaOres.find(o => o.name === name) || basaltOres.find(o => o.name === name);
}

function updateLeaderboard(oreName, variantMultiplier = 1) {
    const info = getOreInfo(oreName);
    if (!info || info.name === "StoneBlock" || info.name === "Stone" || info.name === "Lava" || info.name === "Basalt") return;
    
    const adjustedChance = info.chance * variantMultiplier;

    const existingIdx = leaderboard.findIndex(e => e.name === oreName);
    if (existingIdx !== -1) {
        if (adjustedChance > leaderboard[existingIdx].adjustedChance) {
            leaderboard[existingIdx].adjustedChance = adjustedChance;
            leaderboard[existingIdx].variantMult = variantMultiplier;
        }
    } else {
        leaderboard.push({name: oreName, tier: info.tier, chance: info.chance, adjustedChance: adjustedChance, variantMult: variantMultiplier, time: Date.now()});
    }

    leaderboard.sort((a, b) => b.adjustedChance - a.adjustedChance || a.time - b.time);
    if (leaderboard.length > 10) leaderboard.length = 10;
    renderLeaderboard();
}

document.getElementById("lbVariantToggle").onclick = function() {
    showLeaderboardVariants = !showLeaderboardVariants;
    this.textContent = showLeaderboardVariants ? "Show Base Ores" : "Show Variants";

};

function renderLeaderboard() {
    const list = document.getElementById("leaderboardList");
    list.innerHTML = "";

    if (!showLeaderboardVariants) {
        leaderboard.forEach((entry) => {
            const li = document.createElement("li");
            let extraTag = entry.variantMult > 1 ? ` <span style="color:var(--accent-gold); font-size: 0.75rem;">(${entry.variantMult}x Var)</span>` : '';
            li.innerHTML = `<span class="rarity-${entry.tier.toLowerCase()}">${entry.name}</span>${extraTag} 
                <span style="color:var(--text-muted);">[${entry.tier}]</span> 
                <span style="color:var(--accent-blue);">1/${Math.floor(entry.adjustedChance).toLocaleString()}</span>`;
            list.appendChild(li);
        });
        if (list.childNodes.length === 0) {
            list.innerHTML = "<li style='color:var(--text-muted); list-style:none;'>No rare ores mined yet.</li>";
        }
    } else {
        let variantEntries = [];
        for (let oreName in inventory) {
            const info = getOreInfo(oreName);
            if (!info || info.tier === "Layer" || info.tier === "Lava") continue;

            const itemData = inventory[oreName];
            if (!itemData || !itemData.variants) continue;

            for (let varKey in itemData.variants) {
                let count = itemData.variants[varKey];
                if (count > 0) {
                    let mult = variantMultipliers[varKey] || 1;
                    let adjChance = info.chance * mult;
                    let prefix = varKey.charAt(0).toUpperCase() + varKey.slice(1);
                    let displayName = varKey === "plain" ? oreName : `${prefix} ${oreName}`;
                    variantEntries.push({
                        oreName: oreName,
                        varKey: varKey,
                        displayName: displayName,
                        tier: info.tier,
                        chance: info.chance,
                        adjustedChance: adjChance,
                        variantMult: mult,
                        count: count
                    });
                }
            }
        }

        variantEntries.sort((a, b) => b.adjustedChance - a.adjustedChance);
        variantEntries = variantEntries.slice(0, 10);

        variantEntries.forEach((entry) => {
            const li = document.createElement("li");
            let varTag = entry.variantMult > 1 ? ` <span class="${entry.varKey}" style="font-size: 0.75rem;">(${entry.variantMult}x)</span>` : '';
            li.innerHTML = `<span class="rarity-${entry.tier.toLowerCase()}">${entry.displayName}</span>${varTag} 
                <span style="color:var(--text-muted);">[${entry.tier}]</span> 
                <span style="color:var(--accent-blue);">1/${Math.floor(entry.adjustedChance).toLocaleString()}</span> 
                <span style="color:var(--text-muted); font-size: 0.75rem;">(x${entry.count.toLocaleString()})</span>`;
            list.appendChild(li);
        });

        if (variantEntries.length === 0) {
            list.innerHTML = "<li style='color:var(--text-muted); list-style:none;'>No ore variants obtained yet.</li>";
        }
    }
}

function renderInventory() {
    const container = document.getElementById("inventoryList");
    container.innerHTML = "";

    const filterText = document.getElementById("inventorySearch").value.toLowerCase();
    const sortBy = document.getElementById("inventorySort").value;

    let keys = Object.keys(inventory).filter(name => name.toLowerCase().includes(filterText));

    if (sortBy === "name") {
        keys.sort();
    } else if (sortBy === "count") {
        keys.sort((a, b) => inventory[b].count - inventory[a].count);
    } else if (sortBy === "rarity") {
        keys.sort((a, b) => {
            const infoA = getOreInfo(a);
            const infoB = getOreInfo(b);
            return (infoB ? infoB.chance : 0) - (infoA ? infoA.chance : 0);
        });
    }

    if (keys.length === 0) {
        container.innerHTML = "<div style='color:var(--text-muted); font-size:0.875rem; text-align:center; padding: 20px 0;'>No ores found.</div>";
        return;
    }

    keys.forEach(name => {
        const info = getOreInfo(name);
        if (!info) return;
        const data = inventory[name];
        const v = data.variants;
        const isOpen = !!variantToggles[name];

        const itemDiv = document.createElement("div");
        itemDiv.className = "inv-item";
        itemDiv.innerHTML = `
            <div class="inv-item-row" onclick="toggleVariantView('${name}')">
                <span class="inv-item-name rarity-${info.tier.toLowerCase()}">${name}</span>
                <div>
                    <span class="inv-item-count">${data.count.toLocaleString()}</span>
                    <span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 4px;">${isOpen ? '▲' : '▼'}</span>
                </div>
            </div>
            <div class="inv-variants-panel" id="variants-${name}" style="display: ${isOpen ? 'block' : 'none'};">
                <div class="variant-grid">
                    <div>Plain: <b>${v.plain}</b></div>
                    <div class="gold">Gold: <b>${v.gold}</b></div>
                    <div class="silver">Silver: <b>${v.silver}</b></div>
                    <div class="ionized">Ionized: <b>${v.ionized}</b></div>
                    <div class="quantum">Quantum: <b>${v.quantum}</b></div>
                </div>
            </div>
        `;
        container.appendChild(itemDiv);
    });
}

let baseMiningSpeed = 200;

function getEffectiveMiningSpeed() {
    let speed = baseMiningSpeed;
    if (equippedCoil === "speedCoil") speed -= 105;
    if (equippedCoil === "iceCoil") speed -= 15;
    if (equippedCoil === "exponentialCoil") speed -= 50;

    if (freezeoverActive) speed -= 15;
    if (freezeoverPenaltyActive) speed += 30;

    if (quartzOverloadActive) speed = Math.floor(speed / 2);
    return Math.max(5, speed);
}

function getEffectiveLuck() {
    let l = luck;
    if (pickaxe === "t2_iron") {
        l += ironSpiritBonus;
    }

    if (pickaxe === "t2_quartz") {
        l += 0.05;
        l += (crystalResonanceCharges * 0.02);
        if (quartzOverloadActive) {
            l = 2.5;
        }
    }

    if (freezeoverActive) l += 0.33;
    if (freezeoverPenaltyActive) l -= 0.33;

    let pDef = pickaxeDefinitions.find(p => p.id === pickaxe);
    if (pDef && pDef.abilities) {
        pDef.abilities.forEach(ab => {
            if (ab.type === "passive_luck") l += ab.bonusLuck;
        });
    }
    return Math.max(1, l);
}

function getUniversalProcMultiplier() {
    let multiplier = 1 + (manualProcBoost / 100);

    if (equippedCoil === "iceCoil") {

    if (equippedCoil === "exponentialCoil") {

    let pDef = pickaxeDefinitions.find(p => p.id === pickaxe);

function handleMine(isManualClick = false) {
    let pDef = pickaxeDefinitions.find(p => p.id === pickaxe);
    let totalBlocksToMine = 1;

    if (pDef && pDef.abilities) {
        pDef.abilities.forEach(ab => {
            if (ab.type === "passive_step") {
                if ((blocksMined + 1) % ab.step === 0) {
                    totalBlocksToMine += ab.extraBlocks;
                }
            }

            if (ab.type === "click_warrior" && isManualClick) {
                if (Math.random() < ab.chance) {
                    totalBlocksToMine += ab.count;
                    showNotification(`💥 ${ab.name} Triggered! Mining ${ab.count} extra ores!`);
                }
            }
        });
    }

    let result = bulkMine(totalBlocksToMine);
    renderBulkResult(result, pDef ? pDef.name : "Hand Pick");

    if (pickaxe === "t4_jackpot_jammer") {
        if (!window.jackpotCounter) window.jackpotCounter = 0;
        if (!window.jackpotTarget) window.jackpotTarget = Math.floor(Math.random() * 2500) + 10000;
        
        window.jackpotCounter++;
        if (window.jackpotCounter >= window.jackpotTarget) {
            window.jackpotCounter = 0;
            window.jackpotTarget = Math.floor(Math.random() * 2500) + 10000;
            let roll = Math.floor(Math.random() * 10) + 1;
            showNotification(`🎰 JACKPOT! Rolled a ${roll}! Stats boosted temporarily!`);
            let jackpotRes = bulkMine(roll * 5, 1.3 + (roll * 0.1));
            renderBulkResult(jackpotRes, "Jackpot Jammer: Jackpot Roll!");
        }

        if (Math.random() < (1 / 40) * AttributeSystem.getProcMultiplier()) {
            let crusherRes = bulkMine(16, AttributeSystem.getLuck());
            renderBulkResult(crusherRes, "Casino Crusher Explosion!");
            showNotification("💥 Casino Crusher Moneyblock detonated a 4x4 area!");
        }

        if (Math.random() < (1 / 70) * AttributeSystem.getProcMultiplier()) {
            let blasts = Math.floor(Math.random() * 6) + 10;
            let burstTotalBlocks = blasts * 4;
            let burstRes = bulkMine(burstTotalBlocks, AttributeSystem.getLuck());
            renderBulkResult(burstRes, "Coin Burst Sequence!");
            showNotification(`Coin Burst unleashed ${blasts} waves of coin blocks!`);
        }

        if (Math.random() < 0.005 * AttributeSystem.getProcMultiplier()) {
            let hopRes = bulkMine(36 + 49, AttributeSystem.getLuck() * 1.2);
            renderBulkResult(hopRes, "Heart of the Play Chain!");
            showNotification("Heart of the Play detonated and chained successfully!");
        }
    }

    if (gears.flashGrenade && (blocksMined % 2 === 0)) {
        let flashChance = 0.2 * AttributeSystem.getProcMultiplier();
        if (Math.random() < flashChance) {
            let flashRes = bulkMine(30, 0.5, true);
            renderBulkResult(flashRes, "Flash Bomb Proc!");
            showNotification("💣 Flash Bomb Activated! (+30 ores)");
        }
    }

    if (pDef && pDef.abilities) {
        pDef.abilities.forEach(ab => {
            if (ab.type === "active_burst") {
                let effectiveProcChance = ab.proc * AttributeSystem.getProcMultiplier();
                if (Math.random() < effectiveProcChance) {
                    let forcedLuck = ab.forcedLuck !== undefined ? ab.forcedLuck : null;
                    
                    let bonusBlocks = 0;
                    if (equippedCoil === "exponentialCoil") {
                        bonusBlocks = Math.min(500, Math.round(blocksMined / 8000));
                    }
                    let countToMine = ab.count + bonusBlocks;

                    let burstRes = bulkMine(countToMine, forcedLuck);
                    renderBulkResult(burstRes, `${ab.name} Proc!`);
                    showNotification(`💥 ${ab.name} Triggered! (+${countToMine} blocks)`);
                }
            }

            if (ab.type === "magmatic_volley") {
                if (blocksMined % ab.step === 0) {
                    let baseChance = meltFrenzyActive ? ab.boostedProc : ab.baseProc;
                    let procChance = baseChance * AttributeSystem.getProcMultiplier();
                    if (Math.random() < procChance) {
                        let forcedLuck = meltFrenzyActive ? ab.boostedLuck : ab.baseLuck;

                        let bonusBlocks = 0;
                        if (equippedCoil === "exponentialCoil") {
                            bonusBlocks = Math.min(500, Math.round(blocksMined / 8000));
                        }
                        let countToMine = ab.count + bonusBlocks;

                        let volleyRes = bulkMine(countToMine, forcedLuck);
                        renderBulkResult(volleyRes, `${ab.name} Proc!`);
                        showNotification(`🌋 ${ab.name} Triggered! (+${countToMine} blocks)`);
                    }
                }
            }
        });
    }
}

function renderBlacksmith() {
    const container = document.getElementById("pickaxeListContainer");
    container.innerHTML = "";

    pickaxeDefinitions.forEach(p => {
        const isOwned = unlockedPickaxes.includes(p.id);
        const isEquipped = pickaxe === p.id;
        const card = document.createElement("div");
        card.className = "craft-card";
        
        let reqList = [];
        let canCraft = true;

        if (!isOwned) {
            for (let item in p.req) {
                if (item === "money") {
                    let has = money >= p.req.money;
                    if (!has) canCraft = false;
                    reqList.push(`Money: $${Math.floor(money).toLocaleString()} / $${p.req.money.toLocaleString()}`);
                } else {
                    let hasCount = inventory[item]?.count || 0;
                    if (hasCount < p.req[item]) canCraft = false;
                    reqList.push(`${item}: ${hasCount} / ${p.req[item]}`);
                }
            }
        } else {
            reqList.push("Already Unlocked");
        }

        let abilitiesHtml = p.abilities.map(ab => `<span class="ability-badge">${ab.name}</span>`).join("");
        let descHtml = p.descLines ? p.descLines.join("<br>") : "";

        card.innerHTML = `
            <b>${p.name}</b>
            <div>${abilitiesHtml}</div>
            <div style="font-size:0.8125rem; color:var(--text-muted); margin:6px 0; line-height: 1.4;">${descHtml}</div>
            <div style="font-size:0.75rem; margin-bottom:8px;">${reqList.join(" | ")}</div>
            <div style="display: flex; gap: 6px;">
                <button class="nav-btn" ${isEquipped ? "disabled" : ""} onclick="selectPickaxe('${p.id}')" style="flex:2;">
                    ${isEquipped ? "Equipped" : (isOwned ? "Equip" : "Craft & Equip")}
                </button>
                <button class="nav-btn" onclick="pinRecipe('pickaxe', '${p.id}')" style="flex:1; background: var(--btn-bg);">📌 Pin</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function selectPickaxe(id) {
    const p = pickaxeDefinitions.find(item => item.id === id);
    if (!p) return;

    if (unlockedPickaxes.includes(id)) {
        clearPickaxeEffects();
        pickaxe = id;
        updatePickaxeInfo();
        luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
        updateProcDisplay();
        renderBlacksmith();
        saveData();
        showNotification(`Equipped ${p.name}!`);
        return;
    }

    for (let item in p.req) {
        if (item === "money") {
            if (money < p.req.money) return showNotification("Not enough money!");
        } else {
            if ((inventory[item]?.count || 0) < p.req[item]) return showNotification(`Missing ${item}!`);
        }
    }

    for (let item in p.req) {
        if (item === "money") money -= p.req.money;
        else inventory[item].count -= p.req[item];
    }

    clearPickaxeEffects();
    unlockedPickaxes.push(id);
    pickaxe = id;
    
    updatePickaxeInfo();
    luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
    updateProcDisplay();
    moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
    renderInventory();
    renderBlacksmith();
    saveData();
    if (pinnedRecipe) updatePinBoard();
    showNotification(`Crafted and equipped ${p.name}!`);
}

function clearPickaxeEffects() {
    ironSpiritBonus = 0;
    if (ironSpiritTimer) {
        clearTimeout(ironSpiritTimer);
        ironSpiritTimer = null;
    }

    crystalResonanceCharges = 0;
    if (resonanceTimer) {
        clearTimeout(resonanceTimer);
        resonanceTimer = null;
    }
    if (quartzOverloadActive) {
        quartzOverloadActive = false;
        if (quartzOverloadTimer) {
            clearTimeout(quartzOverloadTimer);
            quartzOverloadTimer = null;
        }
        updateSpeedDisplay();
    }
    quartzChargeProgress = 0;

    meltMeter = 0;
    if (meltFrenzyActive) {
        meltFrenzyActive = false;
        if (meltFrenzyTimer) {
            clearTimeout(meltFrenzyTimer);
            meltFrenzyTimer = null;
        }
    }
    meltFrenzyCooldownUntil = 0;

    luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
    updateSpeedDisplay();
    updateProcDisplay();
    updatePickaxeMeter();
    
    if (autoMining) {
        miningWorker.postMessage({ command: 'start', interval: AttributeSystem.getSpeed() });
    }
}

const gearsToggle = document.getElementById("gearsToggle");
const gearsPanel = document.getElementById("gearsPanel");
const closeGears = document.getElementById("closeGears");

gearsToggle.onclick = () => {
    renderGears();
    gearsPanel.style.display = "block";
};
closeGears.onclick = () => { gearsPanel.style.display = "none"; };

function renderGears() {
    const container = document.getElementById("gearsListContainer");
    container.innerHTML = "";

    let activeGearCount = Object.values(gears).filter(Boolean).length;

    const coilHeader = document.createElement("div");
    coilHeader.style.cssText = "font-size:0.9375rem; margin-bottom:8px; color:var(--accent-purple); text-align:center; font-weight:bold;";
    const equippedCoilDef = equippedCoil ? coilsDefinitions.find(c => c.id === equippedCoil) : null;
    coilHeader.textContent = `🌀 Coil Slot: ${equippedCoilDef ? equippedCoilDef.name : "Empty"} (1 max)`;
    container.appendChild(coilHeader);

    coilsDefinitions.forEach(c => {
        const isOwned = coilsOwned[c.id];
        const isEquipped = equippedCoil === c.id;
        const card = document.createElement("div");
        card.className = "craft-card";
        if (isEquipped) card.style.borderColor = "var(--accent-purple)";

        let reqList = [];
        let canAfford = true;

        for (let item in c.req) {
            let hasCount = inventory[item]?.count || 0;
            if (hasCount < c.req[item]) canAfford = false;
            reqList.push(`${item}: ${hasCount} / ${c.req[item]}`);
        }
        if (!isOwned && c.cost && money < c.cost) canAfford = false;
        if (c.cost) reqList.unshift(`Money: $${c.cost.toLocaleString()}`);

        let btnLabel = isEquipped ? "Unequip" : (isOwned ? "Equip" : "Craft & Equip");
        let descHtml = c.descLines ? c.descLines.join("<br>") : "";

        card.innerHTML = `
            <b>${c.name}</b> ${isOwned ? '<span style="color:var(--accent-green); font-size:0.7rem;">(Owned)</span>' : ''}
            <div style="font-size:0.8125rem; color:var(--text-muted); margin:6px 0; line-height: 1.4;">${descHtml}</div>
            <div style="font-size:0.75rem; margin-bottom:8px;">${reqList.join(" | ")}</div>
            <div style="display: flex; gap: 6px;">
                <button class="nav-btn" onclick="toggleCoil('${c.id}')" style="flex:2;">
                    ${btnLabel}
                </button>
                <button class="nav-btn" onclick="pinRecipe('coil', '${c.id}')" style="flex:1; background: var(--btn-bg);">📌 Pin</button>
            </div>
        `;
        container.appendChild(card);
    });

    const gearHeader = document.createElement("div");
    gearHeader.style.cssText = "font-size:0.9375rem; margin:16px 0 8px; color:var(--accent-blue); text-align:center; font-weight:bold; border-top:1px solid var(--card-border); padding-top:12px;";
    gearHeader.textContent = "⚙️ Gear Mods";
    container.appendChild(gearHeader);

    if (gearSlots < maxGearLimit) {
        let slotCost = getNextSlotCost();
        const upgradeCard = document.createElement("div");
        upgradeCard.className = "craft-card";
        upgradeCard.style.borderColor = "var(--accent-gold)";
        upgradeCard.innerHTML = `
            <b>Gear Slot Capacity (${gearSlots}/${maxGearLimit})</b>
            <div style="font-size:0.8125rem; color:var(--text-muted); margin:4px 0;">Unlock an extra slot to equip more gear simultaneously.</div>
            <div style="font-size:0.75rem; margin-bottom:8px;">Cost: $${slotCost.toLocaleString()}</div>
            <button class="nav-btn" onclick="buyGearSlot()">Expand Slot</button>
        `;
        container.appendChild(upgradeCard);
    }

    const statusDiv = document.createElement("div");
    statusDiv.style.cssText = "font-size:0.875rem; margin-bottom:12px; color:var(--accent-blue); text-align:center;";
    statusDiv.textContent = `Equipped Gears: ${activeGearCount} / ${gearSlots}`;
    container.appendChild(statusDiv);

    gearsDefinitions.forEach(g => {
        const isOwned = gears[g.id];
        const card = document.createElement("div");
        card.className = "craft-card";
        
        let reqList = [];
        let canCraft = true;

        for (let item in g.req) {
            let hasCount = inventory[item]?.count || 0;
            if (hasCount < g.req[item]) canCraft = false;
            reqList.push(`${item}: ${hasCount} / ${g.req[item]}`);
        }
        if (money < g.cost) canCraft = false;
        reqList.unshift(`Money: $${g.cost.toLocaleString()}`);

        let descHtml = g.descLines ? g.descLines.join("<br>") : "";

        card.innerHTML = `
            <b>${g.name}</b>
            <div style="font-size:0.8125rem; color:var(--text-muted); margin:6px 0; line-height: 1.4;">${descHtml}</div>
            <div style="font-size:0.75rem; margin-bottom:8px;">${reqList.join(" | ")}</div>
            <div style="display: flex; gap: 6px;">
                <button class="nav-btn" ${isOwned ? "disabled" : ""} onclick="craftGear('${g.id}')" style="flex:2;">
                    ${isOwned ? "Equipped" : "Craft & Equip"}
                </button>
                <button class="nav-btn" onclick="pinRecipe('gear', '${g.id}')" style="flex:1; background: var(--btn-bg);">📌 Pin</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function getNextSlotCost() {
    let slotsBought = gearSlots - 3;
    if (slotsBought < gearSlotCosts.length) return gearSlotCosts[slotsBought];
    let overflow = slotsBought - (gearSlotCosts.length - 1);
    return Math.floor(gearSlotCosts[gearSlotCosts.length - 1] * Math.pow(100, overflow));
}

function setupIceCoilLoop() {
    if (iceCoilIntervalTimer) clearInterval(iceCoilIntervalTimer);
    if (equippedCoil !== "iceCoil") {
        freezeoverActive = false;
        freezeoverPenaltyActive = false;
        return;
    }

    iceCoilIntervalTimer = setInterval(() => {
        if (equippedCoil !== "iceCoil") return;
        if (Math.random() < 0.5) {
            freezeoverActive = true;
            showNotification("❄️ Freezeover triggered! Speed, Luck, and Proc rates boosted!");
            updateSpeedDisplay();
            luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
            updateProcDisplay();

            if (autoMining) {
                miningWorker.postMessage({ command: 'start', interval: AttributeSystem.getSpeed() });
            }

            setTimeout(() => {
                freezeoverActive = false;
                freezeoverPenaltyActive = true;
                showNotification("🧊 Freezeover ended. Penalty phase active for 15s...");
                updateSpeedDisplay();
                luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
                updateProcDisplay();

                if (autoMining) {
                    miningWorker.postMessage({ command: 'start', interval: AttributeSystem.getSpeed() });
                }

                setTimeout(() => {
                    freezeoverPenaltyActive = false;
                    showNotification("Weather normalized.");
                    updateSpeedDisplay();
                    luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
                    updateProcDisplay();

                    if (autoMining) {
                        miningWorker.postMessage({ command: 'start', interval: AttributeSystem.getSpeed() });
                    }
                }, 15000);
            }, 5000);
        }
    }, 20000);
}

function toggleCoil(id) {
    const c = coilsDefinitions.find(item => item.id === id);
    if (!c) return;

    if (!coilsOwned[id]) {
        let cost = c.cost || 0;
        if (cost > 0 && money < cost) return showNotification("Not enough money!");
        for (let item in c.req) {
            if ((inventory[item]?.count || 0) < c.req[item]) return showNotification(`Missing ${item}!`);
        }

        if (cost > 0) money -= cost;
        for (let item in c.req) {
            inventory[item].count -= c.req[item];
        }
        coilsOwned[id] = true;
        equippedCoil = id;
        showNotification(`Crafted and equipped ${c.name}!`);
    } else if (equippedCoil === id) {
        equippedCoil = null;
        showNotification(`Unequipped ${c.name}.`);
    } else {
        equippedCoil = id;
        showNotification(`Equipped ${c.name}! (Coil slot only fits one at a time)`);
    }

    setupIceCoilLoop();
    renderGears();
    updateSpeedDisplay();
    updateProcDisplay();
    luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
    moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
    renderInventory();
    saveData();
    if (pinnedRecipe) updatePinBoard();
}

function buyGearSlot() {
    if (gearSlots >= maxGearLimit) return showNotification("Maximum gear cap reached!");
    let cost = getNextSlotCost();
    if (money < cost) return showNotification("Not enough money for a new slot!");

    money -= cost;
    gearSlots++;
    
    moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
    renderGears();
    saveData();
    showNotification(`Successfully unlocked Gear Slot ${gearSlots}!`);
}

function craftGear(id) {
    const g = gearsDefinitions.find(item => item.id === id);
    if (!g || gears[id]) return;

    let activeGearCount = Object.values(gears).filter(Boolean).length;
    if (activeGearCount >= gearSlots) {
        return showNotification(`Gear slot limit reached (${gearSlots}). Buy more slots to equip this!`);
    }

    if (money < g.cost) return showNotification("Not enough money!");
    for (let item in g.req) {
        if ((inventory[item]?.count || 0) < g.req[item]) return showNotification(`Missing ${item}!`);
    }

    money -= g.cost;
    for (let item in g.req) {
        inventory[item].count -= g.req[item];
    }

    gears[id] = true;
    renderGears();
    updateSpeedDisplay();
    luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
    moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
    renderInventory();
    saveData();
    if (pinnedRecipe) updatePinBoard();
    showNotification(`Crafted ${g.name}!`);
}

function findOreLayerName(oreName) {
    if (oreName === "money") return "Cash / Global";
    if (ores.some(o => o.name === oreName)) return "World 1 - Layer 1 (Normal)";
    if (lavaOres.some(o => o.name === oreName)) return "World 1 - Layer 2 (Lava)";
    if (basaltOres.some(o => o.name === oreName)) return "World 1 - Layer 3 (Basalt)";
    if (marbleOres.some(o => o.name === oreName)) return "World 1 - Layer 4 (Marble)";
    return "Unknown Layer";
}

function pinRecipe(type, id) {
    pinnedRecipe = { type, id };
    document.getElementById("recipePinBoard").style.display = "block";
    updatePinBoard();
    showNotification("Recipe pinned to screen!");
}

function unpinRecipe() {
    pinnedRecipe = null;
    document.getElementById("recipePinBoard").style.display = "none";
}

function updatePinBoard() {
    if (!pinnedRecipe) return;
    const content = document.getElementById("pinContent");
    content.innerHTML = "";

    let itemDef = null;
    let itemName = "";

    if (pinnedRecipe.type === "pickaxe") {
        itemDef = pickaxeDefinitions.find(p => p.id === pinnedRecipe.id);
        itemName = itemDef ? itemDef.name : "";
    } else if (pinnedRecipe.type === "gear") {
        itemDef = gearsDefinitions.find(g => g.id === pinnedRecipe.id);
        itemName = itemDef ? itemDef.name : "";
    } else if (pinnedRecipe.type === "coil") {
        itemDef = coilsDefinitions.find(c => c.id === pinnedRecipe.id);
        itemName = itemDef ? itemDef.name : "";
    }

    if (!itemDef) {
        unpinRecipe();
        return;
    }

    const titleEl = document.createElement("div");
    titleEl.innerHTML = `<b>${itemName}</b>`;
    content.appendChild(titleEl);

    let totalComponents = 0;
    let completedComponents = 0;

    for (let reqKey in itemDef.req) {
        totalComponents++;
        let requiredAmount = itemDef.req[reqKey];
        let currentAmount = 0;

        if (reqKey === "money") {
            currentAmount = money;
        } else {
            currentAmount = inventory[reqKey]?.count || 0;
        }

        if (currentAmount >= requiredAmount) {
            completedComponents++;
        }

        let percent = Math.min(100, Math.floor((currentAmount / requiredAmount) * 100));
        let layerLocation = findOreLayerName(reqKey);
        let colorStyle = currentAmount >= requiredAmount ? "var(--accent-green)" : "var(--text-main)";

        const row = document.createElement("div");
        row.style.cssText = "background: rgba(255,255,255,0.03); padding: 6px; border-radius: 6px; border: 1px solid var(--card-border);";
        row.innerHTML = `
            <div style="display: flex; justify-content: space-between; margin-bottom: 2px;">
                <span style="color: ${colorStyle};">${reqKey}</span>
                <span>${currentAmount.toLocaleString()} / ${requiredAmount.toLocaleString()}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted);">
                <span>📍 ${layerLocation}</span>
                <span>${percent}%</span>
            </div>
        `;
        content.appendChild(row);
    }

    let overallProgress = Math.floor((completedComponents / totalComponents) * 100);
    const progressEl = document.createElement("div");
    progressEl.style.cssText = "margin-top: 4px; font-weight: bold; text-align: center; color: var(--accent-gold); font-size: 0.75rem;";
    progressEl.textContent = `Overall Progress: ${overallProgress}% Complete`;
    content.appendChild(progressEl);
}

const pinBoard = document.getElementById("recipePinBoard");
const pinHeader = document.getElementById("pinHeader");

pinHeader.onmousedown = function(e) {
    isDraggingPin = true;
    dragOffset.x = e.clientX - pinBoard.offsetLeft;
    dragOffset.y = e.clientY - pinBoard.offsetTop;
    e.preventDefault();
};

document.onmousemove = function(e) {
    if (!isDraggingPin) return;
    pinBoard.style.left = (e.clientX - dragOffset.x) + "px";
    pinBoard.style.top = (e.clientY - dragOffset.y) + "px";
};

document.onmouseup = function() {
    isDraggingPin = false;
};

document.getElementById("worldSelect").value = currentWorld;
document.getElementById("layerSelect").value = currentLayer;

fillOreDropdown(currentLayer);
updatePickaxeInfo();
updatePickaxeMeter();
renderLeaderboard();
renderInventory();
updateSpeedDisplay();
updateProcDisplay();
setupIceCoilLoop();
luckDisplay.textContent = `${AttributeSystem.getLuck().toFixed(2)}x`;
blocksMinedDiv.textContent = blocksMined.toLocaleString();
moneyDiv.textContent = `$${Math.floor(money).toLocaleString()}`;
</script>
